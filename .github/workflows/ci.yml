name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Quiet-period / ensure-main-ci re-dispatch so cancelled main runs can still
  # produce a verified prerelease without disabling PR supersession.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: one group per PR number, cancel stale. Main: unique group per run_id so
  # boolean cancel expressions cannot supersede an in-flight verified build.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-main-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: true

jobs:
  release-plan:
    name: Version plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      released: ${{ steps.plan.outputs.released || 'false' }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/release
      - run: npm test
        working-directory: tools/release
      - name: Verify generated provider catalog
        run: node tools/provider-catalog/generate.mjs --check
      - name: Verify CLI benchmark syntax
        run: node --check benchmarks/cli-startup.mjs
      - name: Calculate prerelease version
        id: plan
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run plan
        working-directory: tools/release
      - name: Skip publishing for pull requests
        id: skip
        if: >-
          github.ref != 'refs/heads/main' ||
          (github.event_name != 'push' && github.event_name != 'workflow_dispatch')
        run: echo "released=false" >> "$GITHUB_OUTPUT"

  harbor-adapter:
    name: Harbor installed-agent adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/harbor/requirements.in
      - name: Install patched Python package installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip==26.2.1'
      - name: Install pinned Harbor agent API
        run: python -m pip install --disable-pip-version-check -r benchmarks/harbor/requirements.in 'pip-audit==2.10.1'
      - name: Audit Harbor adapter dependencies
        run: python -m pip_audit --strict --progress-spinner off
      - name: Validate Harbor adapter
        run: |
          python -m pip check
          python -m py_compile benchmarks/harbor/veasel_agent.py
          python -m unittest discover -s benchmarks/harbor -p 'test_*.py' -v
          python -m unittest discover -s tools/provider-catalog -p 'test_*.py' -v

  backend:
    name: V backend / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    needs: release-plan
    timeout-minutes: 60
    env:
      VJOBS: 1
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macOS, Windows]
        include:
          - os: linux
            runner: ubuntu-22.04
            cc: clang
            binary: dist/veasel
            tui_target: bun-linux-x64
            tui_binary: dist/veasel-tui
          - os: macOS
            runner: macos-latest
            cc: clang
            binary: dist/veasel
            tui_target: bun-darwin-arm64
            tui_binary: dist/veasel-tui
          - os: Windows
            runner: windows-latest
            cc: gcc
            binary: dist/veasel.exe
            tui_target: bun-windows-x64
            tui_binary: dist/veasel-tui.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        id: setup-v
        with:
          version-file: .v-version
      - name: Install bundled SQLite on Linux
        if: runner.os == 'Linux'
        env:
          V_BUILD_ROOT: ${{ steps.setup-v.outputs.bin-path }}
        run: |
          vroot="$V_BUILD_ROOT"
          test -f "$vroot/vlib/db/sqlite/install_thirdparty_sqlite.vsh"
          v run "$vroot/vlib/db/sqlite/install_thirdparty_sqlite.vsh"
      - name: Install V bundled SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          V_BUILD_ROOT: ${{ steps.setup-v.outputs.bin-path }}
        run: |
          $vroot = $env:V_BUILD_ROOT
          if (-not $vroot) { throw 'setup-v did not expose its V source root.' }
          if (-not (Test-Path (Join-Path $vroot 'vlib/db/sqlite/sqlite.c.v'))) {
            throw "V SQLite module is missing from setup-v root: $vroot"
          }
          "V_BUILD_ROOT=$vroot" >> $env:GITHUB_ENV
          $installer = Join-Path $vroot 'vlib/db/sqlite/install_thirdparty_sqlite.vsh'
          if (-not (Test-Path $installer)) { throw "V SQLite installer is missing: $installer" }
          v run $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify formatting
        shell: bash
        run: |
          if ! v fmt -verify .; then
            v fmt -diff .
            exit 1
          fi
      - name: Set up Node.js MCP fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Create output directory
        if: runner.os != 'Windows'
        run: mkdir -p dist
      - name: Create output directory on Windows
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Path dist -Force
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install terminal client dependencies
        run: bun install --frozen-lockfile
        working-directory: tui
      - name: Build Linux backend with bundled SQLite and Clang
        if: runner.os == 'Linux'
        run: |
          # GCC 11 rejects V fastc's static aggregate compound literals; Clang 14 accepts them.
          # Keep Ubuntu 22.04 here so the produced binary retains the Debian 12 glibc baseline.
          mkdir -p "$RUNNER_TEMP/no-pkgconfig"
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/no-pkgconfig"
          v -cc clang -prod \
            -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" \
            -o dist/veasel .
      - name: Build macOS backend with system SQLite
        if: runner.os == 'macOS'
        run: |
          v -cc clang -prod \
            -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" \
            -o dist/veasel .
      - name: Verify Unix binary version
        if: runner.os != 'Windows'
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: |
          test "$(dist/veasel --version)" = "Veasel Code $EXPECTED_VERSION"
          printf '%s\n' "$(dist/veasel --help)" | grep -Fqx 'Examples:'
      - name: Verify Linux release ABI on Debian 12
        if: runner.os == 'Linux'
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: |
          if ldd dist/veasel | grep -Fq 'libsqlite3'; then
            echo 'Release executable unexpectedly depends on system SQLite.' >&2
            exit 1
          fi
          container_version="$(docker run --rm \
            --volume "$PWD/dist:/veasel-dist:ro" \
            debian:bookworm-slim \
            sh -ec '/veasel-dist/veasel --version')"
          test "$container_version" = "Veasel Code $EXPECTED_VERSION"
      - name: Build backend on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vroot = $env:V_BUILD_ROOT
          if (-not $vroot) { throw 'The setup-v source root was not preserved.' }
          $sqlite_source = Join-Path $vroot 'thirdparty/sqlite/sqlite3.c'
          $sqlite_object = Join-Path $vroot 'thirdparty/sqlite/sqlite3.o'
          if (-not (Test-Path $sqlite_source)) { throw "V SQLite source is missing: $sqlite_source" }
          & gcc -O2 -c $sqlite_source -o $sqlite_object
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item -LiteralPath $sqlite_object | Format-List FullName,Length
          if (-not (Test-Path $sqlite_object)) { throw "V SQLite object was not created: $sqlite_object" }
          $build_args = @(
            '-cc', 'gcc', '-prod', '-d',
            "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}",
            '-o', 'dist/veasel.exe', '.'
          )
          & v @build_args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Bun build version
        shell: bash
        run: echo "VEASEL_TUI_BUN_VERSION=$(bun --version)" >> "$GITHUB_ENV"
      - name: Build standalone terminal client
        working-directory: tui
        env:
          VEASEL_TUI_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: bun run build:standalone -- "${{ matrix.tui_target }}" "../${{ matrix.tui_binary }}"
      - name: Verify standalone terminal client
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
          TUI_BINARY: ${{ matrix.tui_binary }}
        run: test "$("$TUI_BINARY" --version)" = "Veasel Code Terminal $EXPECTED_VERSION"
      - name: Verify standalone Linux TUI runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          TUI_BINARY: ${{ matrix.tui_binary }}
        run: |
          dependencies="$RUNNER_TEMP/veasel-tui-ldd.txt"
          ldd "$TUI_BINARY" > "$dependencies"
          if grep -Eq 'not found|libicu|libstdc\+\+' "$dependencies"; then
            cat "$dependencies"
            echo 'The standalone TUI has unresolved or non-baseline runtime dependencies.' >&2
            exit 1
          fi
      - name: Write build provenance
        env:
          VEASEL_BUILD_COMMIT: ${{ github.sha }}
          VEASEL_BUILD_CC: ${{ matrix.cc }}
          VEASEL_RUNNER_OS: ${{ runner.os }}
          VEASEL_RUNNER_ARCH: ${{ runner.arch }}
          VEASEL_TUI_TARGET: ${{ matrix.tui_target }}
          VEASEL_BUILD_FLAGS: >-
            -cc ${{ matrix.cc }} -prod
            -d veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
            -o ${{ matrix.binary }} .
        run: node scripts/build-manifest.mjs "${{ matrix.binary }}" "${{ matrix.tui_binary }}" dist/build.json
      - name: Verify Windows binary version
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: |
          $actual = & dist/veasel.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne "Veasel Code $env:EXPECTED_VERSION") {
            throw "Unexpected binary version: $actual"
          }
          $help_lines = & dist/veasel.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help_text = $help_lines -join "`n"
          if ($help_text -notmatch '(?m)^Examples:$') {
            throw 'Binary help is missing executable examples.'
          }
          $env:VEASEL_PORT = '41873'
          $env:VEASEL_DATA_DIR = Join-Path $env:RUNNER_TEMP "veasel-serve-help-$([guid]::NewGuid())"
          $serve_stdout = Join-Path $env:RUNNER_TEMP 'veasel-serve-help.stdout'
          $serve_stderr = Join-Path $env:RUNNER_TEMP 'veasel-serve-help.stderr'
          $serve_process = Start-Process -FilePath 'dist/veasel.exe' -ArgumentList @('serve', '--help') `
            -NoNewWindow -PassThru -RedirectStandardOutput $serve_stdout -RedirectStandardError $serve_stderr
          if (-not $serve_process.WaitForExit(5000)) {
            $serve_process.Kill()
            throw 'serve --help did not exit without starting the backend.'
          }
          if ($serve_process.ExitCode -ne 0) {
            Get-Content $serve_stderr
            throw "serve --help exited with $($serve_process.ExitCode)."
          }
          $serve_help = Get-Content $serve_stdout -Raw
          if ($serve_help -notmatch '(?m)^Usage: veasel serve$') {
            throw 'serve --help did not print its command usage.'
          }
          if (Test-Path $env:VEASEL_DATA_DIR) {
            throw 'serve --help unexpectedly initialized backend data.'
          }
          Remove-Item Env:VEASEL_PORT
          Remove-Item Env:VEASEL_DATA_DIR
      - name: Run Linux domain tests
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get install -y bubblewrap
          fi
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / -- true
          v test main_test.v
          v test model_settings_test.v
          v test api_metadata_test.v
          v test plugins_test.v
          v test plugins_links_test.v
          v test headless_plugins_test.v
          v test plugin_mcp_transport_test.v
          v test plugin_mcp_http_transport_test.v
          v test plugin_mcp_cancel_test.v
          v test agent_runtime_test.v
          v test shell_commands_test.v
          v test session_compaction_test.v
          v test repository_map_test.v
          v test atif_trace_test.v
          v test provider_usage_test.v
          v test provider_cache_test.v
          v test headless_cli_test.v
          v test headless_config_test.v
          v test workspace_tools_test.v
      - name: Run Windows plugin, workspace edit, and recovery tests
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 50
        env:
          VJOBS: 2
        run: |
          & v -cc gcc -d windows_7 test main_test.v plugins_test.v plugins_links_test.v headless_plugins_test.v plugin_mcp_transport_test.v plugin_mcp_cancel_test.v headless_cli_test.v headless_config_test.v workspace_edits_windows_test.v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & v -cc gcc test model_settings_test.v api_metadata_test.v plugin_mcp_http_transport_test.v shell_commands_test.v repository_map_test.v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run macOS provider settings, backend startup, and shell sandbox tests
        if: runner.os == 'macOS'
        run: |
          v test main_test.v
          v test model_settings_test.v
          v test api_metadata_test.v
          v test headless_config_test.v
          v test plugins_links_test.v
          v test headless_plugins_test.v
          v test plugin_mcp_cancel_test.v
          v test repository_map_test.v
          v test shell_commands_test.v
      - name: Run child-agent lifecycle tests
        timeout-minutes: 10
        env:
          VJOBS: 1
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            v -cc gcc test subagents_test.v
          else
            v test subagents_test.v
          fi
      - name: Run Linux HTTP and persistence smoke
        if: runner.os == 'Linux'
        env:
          VEASEL_SMOKE_TRACE_ARTIFACT: benchmark-results/atif-smoke.json
        run: |
          python3 scripts/test-meta-mock-provider.py
          python3 scripts/test_mock_provider_session_system.py
          mkdir -p benchmark-results
          scripts/api-smoke.sh
      - name: Run standalone TUI integration smoke
        # Uses Unix PTY on Linux/macOS and the native ConPTY path on Windows.
        if: runner.os != 'Windows'
        run: |
          python3 scripts/standalone-tui-smoke.py \
            --server dist/veasel \
            --tui dist/veasel-tui \
            --startup-samples 3 \
            --metrics-output benchmark-results/tui-startup.json
      - name: Run standalone TUI ConPTY integration smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/standalone-tui-smoke.py `
            --server dist/veasel.exe `
            --tui dist/veasel-tui.exe `
            --startup-samples 3 `
            --metrics-output benchmark-results/tui-startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-startup-${{ matrix.os }}
          path: benchmark-results/tui-startup.json
          if-no-files-found: error
          retention-days: 30
      - name: Checkout pinned Harbor trajectory validator
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: harbor-framework/harbor
          ref: dc933be707feafbb9efcdf092cb8a0e391332617
          path: .ci/harbor
          sparse-checkout: |
            src/harbor
      - name: Validate smoke trajectory with Harbor 0.24.0
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .ci/python
          .ci/python/bin/pip install --disable-pip-version-check 'pydantic==2.13.5'
          .ci/python/bin/python scripts/validate-harbor-atif.py .ci/harbor benchmark-results/atif-smoke.json
      - name: Benchmark SQLite session round trips
        if: runner.os == 'Linux'
        env:
          VEASEL_RUN_BENCHMARK: "1"
          VEASEL_BENCH_OUTPUT: benchmark-results/session-store.json
          VEASEL_BENCH_BUILD_MANIFEST: dist/build.json
          VEASEL_BENCH_COMMAND: >-
            v -cc ${{ matrix.cc }} -prod -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" test store_benchmark_test.v
        run: |
          mkdir -p benchmark-results
          v -cc ${{ matrix.cc }} -prod -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" test store_benchmark_test.v
          cat benchmark-results/session-store.json
      - name: Package Unix binaries
        if: runner.os != 'Windows'
        run: |
          tui_binary_name="${{ matrix.tui_binary }}"
          tui_binary_name="${tui_binary_name#dist/}"
          tar -czf dist/veasel-${{ runner.os }}.tar.gz -C dist veasel "$tui_binary_name" build.json
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/veasel.exe,dist/veasel-tui.exe,dist/build.json -DestinationPath dist/veasel-Windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veasel-${{ runner.os }}
          path: dist/veasel-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: benchmark-session-store
          path: benchmark-results/session-store.json
          if-no-files-found: error
          retention-days: 30

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Scan repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Upload scan report to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
      - name: Retain pull request scan report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 7

  tui:
    name: Terminal client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: tui
      - run: bun run typecheck
        working-directory: tui
      - run: bun run test
        working-directory: tui
      - run: bun audit --audit-level=high
        working-directory: tui

  publish-prerelease:
    name: Publish verified prerelease
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.released == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-plan, backend, security, tui, harbor-adapter]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: veasel-publish-prerelease
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: veasel-*
          path: release-assets
          merge-multiple: true
      # The merged download mixes three OS artifacts that each contain a
      # file named like the standalone TUI (Linux ELF, macOS Mach-O), so the
      # loose veasel-tui that lands in release-assets is whichever artifact
      # was merged last — in v0.64.2 it was a binary that segfaulted on
      # startup and did not match the verified build. Take the standalone
      # binaries from the checksum-verified archives instead (each archive
      # carries the exact binary its job verified plus build.json
      # provenance), and fail the publish if they do not match provenance.
      - name: Use verified standalone TUI binaries from archives
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          import zipfile
          from pathlib import Path

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def extract(archive, member, dest):
              if archive.endswith('.zip'):
                  with zipfile.ZipFile(archive) as zf:
                      data = zf.read(member)
              else:
                  with tarfile.open(archive) as tf:
                      data = tf.extractfile(member).read()
              Path(dest).write_bytes(data)

          work = Path('/tmp/standalone-verify')
          work.mkdir(exist_ok=True)
          cases = [
              ('release-assets/veasel-Linux.tar.gz', 'veasel-tui',
               'release-assets/veasel-tui'),
              ('release-assets/veasel-Windows.zip', 'veasel-tui.exe',
               'release-assets/veasel-tui.exe'),
          ]
          for archive, member, dest in cases:
              extract(archive, 'build.json', work / 'build.json')
              provenance = json.loads((work / 'build.json').read_text())
              extract(archive, member, dest)
              actual = sha256(dest)
              expected = provenance['tui_binary_sha256']
              if actual != expected:
                  raise SystemExit(
                      f'{dest} sha256 {actual} != verified provenance {expected}')
              print(f'{dest}: verified against build provenance ({actual})')
          PY
          chmod +x release-assets/veasel-tui
      - name: Build checksums and release manifest
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f \( -name 'veasel-Linux.tar.gz' -o -name 'veasel-macOS.tar.gz' -o -name 'veasel-Windows.zip' \) | sort)
          test "${#archives[@]}" -eq 3
          (
            cd release-assets
            sha256sum veasel-Linux.tar.gz veasel-macOS.tar.gz veasel-Windows.zip > ../SHA256SUMS
            sha256sum --check ../SHA256SUMS
          )
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = []
          for path in sorted(Path('release-assets').iterdir()):
              if path.name not in {'veasel-Linux.tar.gz', 'veasel-macOS.tar.gz', 'veasel-Windows.zip'}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({'name': path.name, 'sha256': digest})
          if len(assets) != 3:
              raise SystemExit('expected Linux, macOS, and Windows release archives')
          Path('release.json').write_text(json.dumps({
              'name': 'Veasel Code',
              'version': os.environ['RELEASE_VERSION'],
              'tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['RELEASE_COMMIT'],
              'channel': 'next',
              'prerelease': True,
              'assets': assets,
          }, indent=2) + '\n')
          PY
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Publish the verified commit that finished CI. Main may have moved
          # ahead while this run was queued; that is OK for the next channel.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq .target_commitish)"
            if [[ "$existing" == "$RELEASE_COMMIT" || "$existing" == "${RELEASE_COMMIT:0:7}" ]]; then
              gh release upload "$RELEASE_TAG" release-assets/* SHA256SUMS release.json --clobber
              exit 0
            fi
            echo "Release $RELEASE_TAG already exists for $existing; skipping duplicate publish of $RELEASE_COMMIT."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-assets/* SHA256SUMS release.json \
            --target "$RELEASE_COMMIT" --title "Veasel Code $RELEASE_VERSION" \
            --generate-notes --prerelease
