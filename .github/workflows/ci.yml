name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Quiet-period / ensure-main-ci re-dispatch so cancelled main runs can still
  # produce a verified prerelease without disabling PR supersession.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: one group per PR number, cancel stale. Main runs SERIALIZE (never
  # cancel, never overlap): the prerelease tag only materializes at publish
  # time, so two overlapping main runs plan the same next version from the
  # same last tag and the second publish fails on a tag collision (run
  # 43921368447). A serialized queue makes each run's release-plan observe
  # the previous run's published tag.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-main-serial', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-plan:
    name: Version plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      released: ${{ steps.plan.outputs.released || 'false' }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/release
      - run: npm test
        working-directory: tools/release
      - name: Verify generated provider catalog
        run: node tools/provider-catalog/generate.mjs --check
      - name: Verify CLI benchmark syntax
        run: node --check benchmarks/cli-startup.mjs
      - name: Calculate prerelease version
        id: plan
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: npm run plan
        working-directory: tools/release
      - name: Skip publishing for pull requests
        id: skip
        if: >-
          github.ref != 'refs/heads/main' ||
          (github.event_name != 'push' && github.event_name != 'workflow_dispatch')
        run: echo "released=false" >> "$GITHUB_OUTPUT"

  harbor-adapter:
    name: Harbor installed-agent adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/harbor/requirements.in
      - name: Install patched Python package installer
        run: python -m pip install --disable-pip-version-check --upgrade 'pip==26.2.1'
      - name: Install pinned Harbor agent API
        run: python -m pip install --disable-pip-version-check -r benchmarks/harbor/requirements.in 'pip-audit==2.10.1'
      - name: Install Bubblewrap for benchmark isolation tests
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get install -y bubblewrap
          fi
          sudo bwrap --unshare-all --unshare-user --disable-userns --die-with-parent --new-session --ro-bind / / -- true
          cat > "$RUNNER_TEMP/veasel-bwrap-root" <<'EOF'
          #!/bin/sh
          exec sudo -n /usr/bin/bwrap --disable-userns "$@"
          EOF
          chmod 700 "$RUNNER_TEMP/veasel-bwrap-root"
      - name: Audit Harbor adapter dependencies
        run: python -m pip_audit --strict --progress-spinner off
      - name: Validate Harbor adapter
        run: |
          python -m pip check
          python -m py_compile benchmarks/harbor/veasel_agent.py
          python -m unittest discover -s benchmarks/harbor -p 'test_*.py' -v
          python -m py_compile benchmarks/real-task/run.py
          python -m unittest discover -s tools/provider-catalog -p 'test_*.py' -v
          python -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Run real-task sandbox tests with kernel namespace capabilities
        env:
          VEASEL_BWRAP: ${{ runner.temp }}/veasel-bwrap-root
        run: python -m unittest discover -s benchmarks/real-task -p 'test_*.py' -v

  backend:
    name: V backend / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    needs: release-plan
    # Windows: gcc recompiles the whole module per test file (~3 min/file);
    # measured full-job need is ~100 min. 120 keeps a guard without hiding
    # a hang (each test step keeps its own 50 min timeout).
    timeout-minutes: ${{ matrix.os == 'Windows' && 120 || 60 }}
    env:
      VJOBS: 1
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macOS, Windows]
        include:
          - os: linux
            runner: ubuntu-22.04
            cc: clang
            binary: dist/veasel
            tui_target: bun-linux-x64
            tui_binary: dist/veasel-tui
          - os: macOS
            runner: macos-latest
            cc: clang
            binary: dist/veasel
            tui_target: bun-darwin-arm64
            tui_binary: dist/veasel-tui
          - os: Windows
            runner: windows-latest
            cc: gcc
            binary: dist/veasel.exe
            tui_target: bun-windows-x64
            tui_binary: dist/veasel-tui.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        id: setup-v
        with:
          version-file: .v-version
      - name: Install bundled SQLite on Linux
        if: runner.os == 'Linux'
        env:
          V_BUILD_ROOT: ${{ steps.setup-v.outputs.bin-path }}
        run: |
          vroot="$V_BUILD_ROOT"
          test -f "$vroot/vlib/db/sqlite/install_thirdparty_sqlite.vsh"
          v run "$vroot/vlib/db/sqlite/install_thirdparty_sqlite.vsh"
      - name: Install V bundled SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          V_BUILD_ROOT: ${{ steps.setup-v.outputs.bin-path }}
        run: |
          $vroot = $env:V_BUILD_ROOT
          if (-not $vroot) { throw 'setup-v did not expose its V source root.' }
          if (-not (Test-Path (Join-Path $vroot 'vlib/db/sqlite/sqlite.c.v'))) {
            throw "V SQLite module is missing from setup-v root: $vroot"
          }
          "V_BUILD_ROOT=$vroot" >> $env:GITHUB_ENV
          $installer = Join-Path $vroot 'vlib/db/sqlite/install_thirdparty_sqlite.vsh'
          if (-not (Test-Path $installer)) { throw "V SQLite installer is missing: $installer" }
          v run $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify formatting
        shell: bash
        run: |
          if ! v fmt -verify .; then
            v fmt -diff .
            exit 1
          fi
      - name: Set up Node.js MCP fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Create output directory
        if: runner.os != 'Windows'
        run: mkdir -p dist
      - name: Create output directory on Windows
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Path dist -Force
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install terminal client dependencies
        run: bun install --frozen-lockfile
        working-directory: tui
      - name: Build Linux backend with bundled SQLite and Clang
        if: runner.os == 'Linux'
        run: |
          # GCC 11 rejects V fastc's static aggregate compound literals; Clang 14 accepts them.
          # Keep Ubuntu 22.04 here so the produced binary retains the Debian 12 glibc baseline.
          mkdir -p "$RUNNER_TEMP/no-pkgconfig"
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/no-pkgconfig"
          v -cc clang -prod \
            -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" \
            -o dist/veasel .
      - name: Build macOS backend with system SQLite
        if: runner.os == 'macOS'
        run: |
          v -cc clang -prod \
            -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" \
            -o dist/veasel .
      - name: Verify Unix binary version
        if: runner.os != 'Windows'
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: |
          test "$(dist/veasel --version)" = "Veasel Code $EXPECTED_VERSION"
          printf '%s\n' "$(dist/veasel --help)" | grep -Fqx 'Examples:'
      - name: Verify Linux release ABI on Debian 12
        if: runner.os == 'Linux'
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: |
          if ldd dist/veasel | grep -Fq 'libsqlite3'; then
            echo 'Release executable unexpectedly depends on system SQLite.' >&2
            exit 1
          fi
          container_version="$(docker run --rm \
            --volume "$PWD/dist:/veasel-dist:ro" \
            debian:bookworm-slim \
            sh -ec '/veasel-dist/veasel --version')"
          test "$container_version" = "Veasel Code $EXPECTED_VERSION"
      - name: Build backend on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vroot = $env:V_BUILD_ROOT
          if (-not $vroot) { throw 'The setup-v source root was not preserved.' }
          $sqlite_source = Join-Path $vroot 'thirdparty/sqlite/sqlite3.c'
          $sqlite_object = Join-Path $vroot 'thirdparty/sqlite/sqlite3.o'
          if (-not (Test-Path $sqlite_source)) { throw "V SQLite source is missing: $sqlite_source" }
          & gcc -O2 -c $sqlite_source -o $sqlite_object
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item -LiteralPath $sqlite_object | Format-List FullName,Length
          if (-not (Test-Path $sqlite_object)) { throw "V SQLite object was not created: $sqlite_object" }
          $build_args = @(
            '-cc', 'gcc', '-prod', '-d',
            "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}",
            '-o', 'dist/veasel.exe', '.'
          )
          & v @build_args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record Bun build version
        shell: bash
        run: echo "VEASEL_TUI_BUN_VERSION=$(bun --version)" >> "$GITHUB_ENV"
      - name: Build standalone terminal client
        working-directory: tui
        env:
          VEASEL_TUI_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: bun run build:standalone -- "${{ matrix.tui_target }}" "../${{ matrix.tui_binary }}"
      - name: Verify standalone terminal client
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
          TUI_BINARY: ${{ matrix.tui_binary }}
        run: test "$("$TUI_BINARY" --version)" = "Veasel Code Terminal $EXPECTED_VERSION"
      - name: Verify standalone Linux TUI runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          TUI_BINARY: ${{ matrix.tui_binary }}
        run: |
          dependencies="$RUNNER_TEMP/veasel-tui-ldd.txt"
          ldd "$TUI_BINARY" > "$dependencies"
          if grep -Eq 'not found|libicu|libstdc\+\+' "$dependencies"; then
            cat "$dependencies"
            echo 'The standalone TUI has unresolved or non-baseline runtime dependencies.' >&2
            exit 1
          fi
      - name: Write build provenance
        env:
          VEASEL_BUILD_COMMIT: ${{ github.sha }}
          VEASEL_BUILD_CC: ${{ matrix.cc }}
          VEASEL_RUNNER_OS: ${{ runner.os }}
          VEASEL_RUNNER_ARCH: ${{ runner.arch }}
          VEASEL_TUI_TARGET: ${{ matrix.tui_target }}
          VEASEL_BUILD_FLAGS: >-
            -cc ${{ matrix.cc }} -prod
            -d veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
            -o ${{ matrix.binary }} .
        run: node scripts/build-manifest.mjs "${{ matrix.binary }}" "${{ matrix.tui_binary }}" dist/build.json
      - name: Verify Windows binary version
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version || '0.1.0-dev' }}
        run: |
          $actual = & dist/veasel.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne "Veasel Code $env:EXPECTED_VERSION") {
            throw "Unexpected binary version: $actual"
          }
          $help_lines = & dist/veasel.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $help_text = $help_lines -join "`n"
          if ($help_text -notmatch '(?m)^Examples:$') {
            throw 'Binary help is missing executable examples.'
          }
          $env:VEASEL_PORT = '41873'
          $env:VEASEL_DATA_DIR = Join-Path $env:RUNNER_TEMP "veasel-serve-help-$([guid]::NewGuid())"
          $serve_stdout = Join-Path $env:RUNNER_TEMP 'veasel-serve-help.stdout'
          $serve_stderr = Join-Path $env:RUNNER_TEMP 'veasel-serve-help.stderr'
          $serve_process = Start-Process -FilePath 'dist/veasel.exe' -ArgumentList @('serve', '--help') `
            -NoNewWindow -PassThru -RedirectStandardOutput $serve_stdout -RedirectStandardError $serve_stderr
          if (-not $serve_process.WaitForExit(5000)) {
            $serve_process.Kill()
            throw 'serve --help did not exit without starting the backend.'
          }
          if ($serve_process.ExitCode -ne 0) {
            Get-Content $serve_stderr
            throw "serve --help exited with $($serve_process.ExitCode)."
          }
          $serve_help = Get-Content $serve_stdout -Raw
          if ($serve_help -notmatch '(?m)^Usage: veasel serve$') {
            throw 'serve --help did not print its command usage.'
          }
          if (Test-Path $env:VEASEL_DATA_DIR) {
            throw 'serve --help unexpectedly initialized backend data.'
          }
          Remove-Item Env:VEASEL_PORT
          Remove-Item Env:VEASEL_DATA_DIR
      - name: Run Linux domain tests
        if: runner.os == 'Linux'
        # Each listed file compiles the whole module (~1 min); the list
        # outgrew 20 minutes as provider CLI suites were added.
        timeout-minutes: 35
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get install -y bubblewrap
          fi
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / -- true
          v test main_test.v
          v test api_auth_test.v
          v test model_settings_test.v
          v test secret_store_test.v
          v test api_metadata_test.v
          v test plugins_test.v
          v test plugins_links_test.v
          v test headless_plugins_test.v
          v test plugin_mcp_transport_test.v
          v test plugin_mcp_http_transport_test.v
          v test plugin_mcp_cancel_test.v
          VEASEL_AGENT_PARENT_TOKEN_BUDGET=3000000 v test agent_runtime_test.v
          v test shell_commands_test.v
          # Adversarial confinement/limit tests (#642): symlink/hardlink/TOCTOU
          # races, protected names, child rlimits, network deny, fork bomb.
          v test workspace_confinement_test.v
          v test subagent_resource_limits_test.v
          v test subagent_integration_test.v
          v test session_compaction_test.v
          v test repository_map_test.v
          v test atif_trace_test.v
          v test provider_usage_test.v
          v test provider_cache_test.v
          v test provider_cli_codex_session_test.v
          v test provider_cli_opencode_session_test.v
          v test provider_cli_muse_session_test.v
          v test provider_cli_resume_test.v
          v test headless_cli_test.v
          v test headless_config_test.v
          v test workspace_tools_test.v
      # Split into batches of <=6 files: every file recompiles the whole
      # module with gcc on Windows (~3 min/file at VJOBS=2, measured on run
      # 44594397273: 11 files = 33 min wall, runtime only ~42 s). A single
      # 17-file step exceeds any sane step timeout although no test hangs;
      # each batch keeps the 50 min step guard.
      - name: Run Windows plugin, workspace edit, and recovery tests (batch 1)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 50
        env:
          VJOBS: 2
        run: |
          & v -cc gcc -d windows_7 test main_test.v api_auth_test.v api_auth_windows_test.v plugins_test.v plugins_links_test.v headless_plugins_test.v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows plugin, workspace edit, and recovery tests (batch 2)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 50
        env:
          VJOBS: 2
        run: |
          & v -cc gcc -d windows_7 test plugin_mcp_transport_test.v plugin_mcp_cancel_test.v headless_cli_test.v headless_config_test.v workspace_edits_windows_test.v workspace_confinement_windows_test.v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows plugin, workspace edit, and recovery tests (batch 3)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 50
        env:
          VJOBS: 2
        run: |
          & v -cc gcc test model_settings_test.v secret_store_test.v api_metadata_test.v plugin_mcp_http_transport_test.v shell_commands_test.v repository_map_test.v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run macOS provider settings, backend startup, and shell sandbox tests
        if: runner.os == 'macOS'
        run: |
          v test main_test.v
          v test api_auth_test.v
          v test model_settings_test.v
          v test secret_store_test.v
          v test api_metadata_test.v
          v test headless_config_test.v
          v test plugins_links_test.v
          v test headless_plugins_test.v
          v test plugin_mcp_cancel_test.v
          v test repository_map_test.v
          v test shell_commands_test.v
          v test workspace_confinement_test.v
      - name: Native OS keychain round trip (macOS Keychain / Windows Credential Manager)
        if: runner.os != 'Linux'
        # Exercises the real credential store on hosted runners. Advisory
        # until proven stable on headless runner sessions (issue #690).
        continue-on-error: true
        shell: bash
        env:
          VEASEL_NATIVE_KEYCHAIN_TEST: '1'
        run: v test secret_store_native_test.v
      - name: Run child-agent lifecycle tests
        timeout-minutes: 20
        env:
          VJOBS: 1
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            v -cc gcc test subagents_test.v
          else
            v test subagents_test.v
          fi
      - name: Run Linux HTTP and persistence smoke
        if: runner.os == 'Linux'
        env:
          VEASEL_SMOKE_TRACE_ARTIFACT: benchmark-results/atif-smoke.json
        run: |
          python3 scripts/test-meta-mock-provider.py
          python3 scripts/test_mock_provider_session_system.py
          python3 scripts/test_mock_provider_acceptance_review.py
          python3 scripts/test_mock_provider_cancellation.py
          python3 scripts/test_terminal_screen.py
          mkdir -p benchmark-results
          scripts/api-smoke.sh
          python3 scripts/auth-lifecycle-smoke.py --server dist/veasel
          python3 scripts/legacy-backend-refusal-smoke.py --server dist/veasel
          python3 benchmarks/deterministic/run.py --veasel dist/veasel --report benchmark-results/deterministic.json
      - name: Package Unix binaries for artifact smoke
        if: runner.os != 'Windows'
        run: |
          tui_binary_name="${{ matrix.tui_binary }}"
          tui_binary_name="${tui_binary_name#dist/}"
          # Bundled offline Library content (#706) ships next to the binary.
          cp -r bundled dist/bundled
          tar -czf dist/veasel-${{ runner.os }}.tar.gz -C dist veasel "$tui_binary_name" build.json bundled
      - name: Package Windows binaries for artifact smoke
        if: runner.os == 'Windows'
        run: |
          Copy-Item -Recurse bundled dist/bundled
          Compress-Archive -Path dist/veasel.exe,dist/veasel-tui.exe,dist/build.json,dist/bundled -DestinationPath dist/veasel-Windows.zip
      - name: Extract and verify packaged binaries
        env:
          VEASEL_PACKAGE_ARCHIVE: dist/veasel-Windows.zip
          VEASEL_PACKAGE_DESTINATION: ${{ runner.temp }}/veasel-package
        run: python scripts/extract-verified-package.py "$env:VEASEL_PACKAGE_ARCHIVE" "$env:VEASEL_PACKAGE_DESTINATION"
        if: runner.os == 'Windows'
        shell: pwsh
      - name: Extract and verify packaged binaries
        env:
          VEASEL_PACKAGE_ARCHIVE: dist/veasel-${{ runner.os }}.tar.gz
          VEASEL_PACKAGE_DESTINATION: ${{ runner.temp }}/veasel-package
        run: python3 scripts/extract-verified-package.py "$VEASEL_PACKAGE_ARCHIVE" "$VEASEL_PACKAGE_DESTINATION"
        if: runner.os != 'Windows'
      - name: Run standalone TUI integration smoke
        # Uses Unix PTY on Linux/macOS and the native ConPTY path on Windows.
        if: runner.os != 'Windows'
        run: |
          python3 scripts/standalone-tui-smoke.py \
            --server "$RUNNER_TEMP/veasel-package/veasel" \
            --tui "$RUNNER_TEMP/veasel-package/veasel-tui" \
            --startup-samples 3 \
            --metrics-output benchmark-results/tui-startup.json
      - name: Run standalone TUI ConPTY integration smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/standalone-tui-smoke.py `
            --server "$env:RUNNER_TEMP/veasel-package/veasel.exe" `
            --tui "$env:RUNNER_TEMP/veasel-package/veasel-tui.exe" `
            --startup-samples 3 `
            --metrics-output benchmark-results/tui-startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tui-startup-${{ matrix.os }}
          path: benchmark-results/tui-startup.json
          if-no-files-found: error
          retention-days: 30
      - name: Checkout pinned Harbor trajectory validator
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: harbor-framework/harbor
          ref: dc933be707feafbb9efcdf092cb8a0e391332617
          path: .ci/harbor
          sparse-checkout: |
            src/harbor
      - name: Validate smoke trajectory with Harbor 0.24.0
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .ci/python
          .ci/python/bin/pip install --disable-pip-version-check 'pydantic==2.13.5'
          .ci/python/bin/python scripts/validate-harbor-atif.py .ci/harbor benchmark-results/atif-smoke.json
      - name: Benchmark SQLite session round trips
        if: runner.os == 'Linux'
        env:
          VEASEL_RUN_BENCHMARK: "1"
          VEASEL_BENCH_OUTPUT: benchmark-results/session-store.json
          VEASEL_BENCH_BUILD_MANIFEST: dist/build.json
          VEASEL_BENCH_COMMAND: >-
            v -cc ${{ matrix.cc }} -prod -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" test store_benchmark_test.v
        run: |
          mkdir -p benchmark-results
          v -cc ${{ matrix.cc }} -prod -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" test store_benchmark_test.v
          cat benchmark-results/session-store.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veasel-${{ runner.os }}
          path: dist/veasel-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: benchmark-session-store
          path: |
            benchmark-results/session-store.json
            benchmark-results/deterministic.json
          if-no-files-found: error
          retention-days: 30

      - name: Record this platform's verified result
        # Runs last and always: `job.status` is success only when every
        # earlier step (build, smoke, verification, upload) passed. The
        # publish gate reads this, so one failing OS never hides another's
        # result and a half-passed leg is never treated as publishable.
        if: always()
        shell: bash
        run: |
          mkdir -p backend-status
          echo "${{ job.status }}" > backend-status/result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-status-${{ matrix.os }}
          path: backend-status/result
          retention-days: 7

  v-test-coverage:
    name: V test coverage guard
    # Fails when a *_test.v is run by no CI job (the explicit file lists in the
    # backend job had silently left most suites unexecuted).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/ci/check_v_test_coverage.py .

  v-extra-tests:
    name: V extra tests / linux (shard ${{ matrix.shard }})
    # Runs every V test file the backend job does not list. Sharded across
    # runners because each file compiles the whole module (~1 min). Non-required
    # until the suite has been stable; the coverage guard keeps the list honest.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      VJOBS: 1
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        id: setup-v
        with:
          version-file: .v-version
      - name: Install bundled SQLite
        env:
          V_BUILD_ROOT: ${{ steps.setup-v.outputs.bin-path }}
        run: |
          vroot="$V_BUILD_ROOT"
          test -f "$vroot/vlib/db/sqlite/install_thirdparty_sqlite.vsh"
          v run "$vroot/vlib/db/sqlite/install_thirdparty_sqlite.vsh"
      - name: Set up Node.js MCP fixtures
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Run shard ${{ matrix.shard }} of 6
        env:
          VEASEL_AGENT_PARENT_TOKEN_BUDGET: "3000000"
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get install -y bubblewrap
          fi
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / -- true
          tools/ci/run_v_tests_shard.sh ${{ matrix.shard }} 6

  platform-status:
    name: Per-platform backend status
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.released == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-plan, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      linux: ${{ steps.collect.outputs.linux }}
      macos: ${{ steps.collect.outputs.macos }}
      windows: ${{ steps.collect.outputs.windows }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: backend-status-*
          path: backend-status
      - id: collect
        run: |
          set -euo pipefail
          # Missing/unknown value (job never got a runner) is reported empty,
          # which the release tooling records as `unavailable`, never success.
          read_result() {
            local f="backend-status/backend-status-$1/result" v=""
            [[ -f "$f" ]] && v="$(tr -d '[:space:]' < "$f")"
            case "$v" in success|failure|cancelled|skipped) echo "$v" ;; *) echo "" ;; esac
          }
          {
            echo "linux=$(read_result linux)"
            echo "macos=$(read_result macOS)"
            echo "windows=$(read_result Windows)"
          } | tee -a "$GITHUB_OUTPUT"

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Scan repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Upload scan report to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
      - name: Retain pull request scan report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 7

  tui:
    name: Terminal client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: tui
      - run: bun run typecheck
        working-directory: tui
      - run: bun run test
        working-directory: tui
      - run: bun audit --audit-level=high
        working-directory: tui

  desktop:
    name: Desktop client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Activate pinned pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm type-check
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: pnpm build:all
        working-directory: desktop

  desktop-package:
    name: Desktop package (Linux)
    if: >-
      !cancelled() &&
      needs.platform-status.outputs.linux == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.released == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-plan, platform-status]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the verified Linux backend archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: veasel-Linux
          path: backend-archive
      - name: Extract the verified backend binary
        run: |
          set -euo pipefail
          mkdir -p backend-bin
          tar -xzf backend-archive/veasel-Linux.tar.gz -C backend-bin veasel
          chmod +x backend-bin/veasel
          test "$(backend-bin/veasel --version)" = "Veasel Code ${{ needs.release-plan.outputs.version }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Activate pinned pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Stage the verified backend and build
        env:
          VEASEL_BACKEND_BIN: ${{ github.workspace }}/backend-bin/veasel
        run: |
          pnpm stage:backend
          pnpm build:all
        working-directory: desktop
      - name: Package Linux AppImage and DEB at the release version
        run: |
          ./node_modules/.bin/electron-builder --linux AppImage deb \
            -c.extraMetadata.version="${{ needs.release-plan.outputs.version }}"
          test "$(release/linux-unpacked/resources/bin/veasel --version)" = "Veasel Code ${{ needs.release-plan.outputs.version }}"
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veasel-desktop-Linux
          path: |
            desktop/release/veasel-desktop-*.AppImage
            desktop/release/veasel-desktop-*.deb
          if-no-files-found: error
          retention-days: 7

  desktop-package-macos:
    name: Desktop package (macOS)
    if: >-
      !cancelled() &&
      needs.platform-status.outputs.macos == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.released == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-plan, platform-status]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the verified macOS backend archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: veasel-macOS
          path: backend-archive
      - name: Extract the verified backend binary
        run: |
          set -euo pipefail
          mkdir -p backend-bin
          tar -xzf backend-archive/veasel-macOS.tar.gz -C backend-bin veasel
          chmod +x backend-bin/veasel
          test "$(backend-bin/veasel --version)" = "Veasel Code ${{ needs.release-plan.outputs.version }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Activate pinned pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Stage the verified backend and build
        env:
          VEASEL_BACKEND_BIN: ${{ github.workspace }}/backend-bin/veasel
        run: |
          pnpm stage:backend
          pnpm build:all
        working-directory: desktop
      - name: Package macOS DMG at the release version (unsigned)
        run: |
          ./node_modules/.bin/electron-builder --mac dmg \
            -c.extraMetadata.version="${{ needs.release-plan.outputs.version }}"
          test "$(release/mac-arm64/Veasel.app/Contents/Resources/bin/veasel --version)" = "Veasel Code ${{ needs.release-plan.outputs.version }}"
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veasel-desktop-macOS
          path: desktop/release/veasel-desktop-*.dmg
          if-no-files-found: error
          retention-days: 7

  desktop-package-windows:
    name: Desktop package (Windows)
    if: >-
      !cancelled() &&
      needs.platform-status.outputs.windows == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.released == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-plan, platform-status]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the verified Windows backend archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: veasel-Windows
          path: backend-archive
      - name: Extract the verified backend binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend-bin | Out-Null
          Expand-Archive backend-archive/veasel-Windows.zip -DestinationPath backend-bin -Force
          $version = & backend-bin/veasel.exe --version
          if ($version -ne "Veasel Code ${{ needs.release-plan.outputs.version }}") { throw "backend version mismatch: $version" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Activate pinned pnpm via Corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Stage the verified backend and build
        env:
          VEASEL_BACKEND_BIN: ${{ github.workspace }}/backend-bin/veasel.exe
        run: |
          pnpm stage:backend
          pnpm build:all
        working-directory: desktop
      - name: Package Windows NSIS at the release version (unsigned)
        # Single line: the default pwsh shell has no bash `\` continuation.
        run: ./node_modules/.bin/electron-builder --win nsis '-c.extraMetadata.version=${{ needs.release-plan.outputs.version }}'
        working-directory: desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veasel-desktop-Windows
          path: desktop/release/veasel-desktop-*.exe
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    name: Publish verified prerelease
    # Linux-first: release-plan, security, tui, harbor-adapter and the Linux
    # backend leg must be exactly `success`. macOS/Windows backend legs and
    # every Desktop lane are optional: each is attached only when its own job
    # result is `success`, otherwise it is absent and release.json/notes record
    # its status (failed/cancelled/skipped/unavailable). Never inferred.
    if: >-
      !cancelled() &&
      needs.release-plan.result == 'success' &&
      needs.platform-status.outputs.linux == 'success' &&
      needs.security.result == 'success' &&
      needs.tui.result == 'success' &&
      needs.harbor-adapter.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.released == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-plan, platform-status, security, tui, harbor-adapter, desktop-package, desktop-package-macos, desktop-package-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: veasel-publish-prerelease
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: veasel-*
          path: release-assets
          merge-multiple: true
      # The merged download mixes three OS artifacts that each contain a
      # file named like the standalone TUI, so loose binaries here are not
      # trustworthy (v0.64.2 shipped one that segfaulted). The staging script
      # takes standalone binaries only from the checksum-verified archives,
      # checks them against build.json provenance, and builds the complete
      # upload set (SHA256SUMS + release.json cover every uploaded asset).
      # Each non-Linux platform and each Desktop lane is attached only when its
      # own job succeeded; the rest are listed as not included.
      - name: Stage verified release assets
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          CLI_RESULTS: linux=${{ needs.platform-status.outputs.linux }},macos=${{ needs.platform-status.outputs.macos }},windows=${{ needs.platform-status.outputs.windows }}
          DESKTOP_LANES: linux=${{ needs.desktop-package.result }},macos=${{ needs.desktop-package-macos.result }},windows=${{ needs.desktop-package-windows.result }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          python3 tools/release/build_release_assets.py \
            --assets-dir release-assets --out-dir release-upload \
            --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
            --commit "$RELEASE_COMMIT" --cli-results "$CLI_RESULTS" \
            --desktop-lanes "$DESKTOP_LANES"
          (cd release-upload && sha256sum --check SHA256SUMS)
      - name: Publish GitHub prerelease (draft, verify, publish; never overwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: tools/release/publish-release.sh release-upload RELEASE_NOTES.md
