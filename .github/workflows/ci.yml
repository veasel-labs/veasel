name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: Version plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      released: ${{ steps.plan.outputs.released || 'false' }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/release
      - run: npm test
        working-directory: tools/release
      - name: Calculate prerelease version
        id: plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run plan
        working-directory: tools/release
      - name: Skip publishing for pull requests
        id: skip
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo "released=false" >> "$GITHUB_OUTPUT"

  backend:
    name: V backend / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: release-plan
    timeout-minutes: 25
    env:
      VJOBS: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        id: setup-v
        with:
          version-file: .v-version
      - name: Install SQLite development files on Linux
        if: runner.os == 'Linux'
        run: |
          if pkg-config --exists sqlite3 && test -r /usr/include/sqlite3.h; then
            pkg-config --modversion sqlite3
          else
            sudo apt-get update
            sudo apt-get install --yes libsqlite3-dev
          fi
      - name: Install V bundled SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          V_BUILD_ROOT: ${{ steps.setup-v.outputs.bin-path }}
        run: |
          $vroot = $env:V_BUILD_ROOT
          if (-not $vroot) { throw 'setup-v did not expose its V source root.' }
          if (-not (Test-Path (Join-Path $vroot 'vlib/db/sqlite/sqlite.c.v'))) {
            throw "V SQLite module is missing from setup-v root: $vroot"
          }
          "V_BUILD_ROOT=$vroot" >> $env:GITHUB_ENV
          $installer = Join-Path $vroot 'vlib/db/sqlite/install_thirdparty_sqlite.vsh'
          if (-not (Test-Path $installer)) { throw "V SQLite installer is missing: $installer" }
          v run $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify formatting
        run: v fmt -verify .
      - name: Create output directory
        if: runner.os != 'Windows'
        run: mkdir -p dist
      - name: Create output directory on Windows
        if: runner.os == 'Windows'
        run: New-Item -ItemType Directory -Path dist -Force
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install terminal client dependencies
        run: bun install --frozen-lockfile
        working-directory: tui
      - name: Build backend on Unix
        if: runner.os != 'Windows'
        run: v -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" -prod -o dist/veasel .
      - name: Build backend on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vroot = $env:V_BUILD_ROOT
          if (-not $vroot) { throw 'The setup-v source root was not preserved.' }
          $sqlite_source = Join-Path $vroot 'thirdparty/sqlite/sqlite3.c'
          $sqlite_object = Join-Path $vroot 'thirdparty/sqlite/sqlite3.o'
          if (-not (Test-Path $sqlite_source)) { throw "V SQLite source is missing: $sqlite_source" }
          & gcc -O2 -c $sqlite_source -o $sqlite_object
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item -LiteralPath $sqlite_object | Format-List FullName,Length
          if (-not (Test-Path $sqlite_object)) { throw "V SQLite object was not created: $sqlite_object" }
          & v -d "veasel_version=${{ needs.release-plan.outputs.version || '0.1.0-dev' }}" -prod -o dist/veasel.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle terminal client on Unix
        if: runner.os != 'Windows'
        run: cp -R tui dist/tui
      - name: Bundle terminal client on Windows
        if: runner.os == 'Windows'
        run: Copy-Item -Path tui -Destination dist/tui -Recurse
      - name: Run Linux domain tests
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          v test main_test.v
          v test plugins_test.v
      - name: Run Linux HTTP and persistence smoke
        if: runner.os == 'Linux'
        run: scripts/api-smoke.sh
      - name: Benchmark SQLite session round trips
        if: runner.os == 'Linux'
        run: |
          mkdir -p benchmark-results
          VEASEL_RUN_BENCHMARK=1 VEASEL_BENCH_OUTPUT=benchmark-results/session-store.json v -prod test store_benchmark_test.v
          cat benchmark-results/session-store.json
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf dist/veasel-${{ runner.os }}.tar.gz -C dist veasel tui
      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/veasel.exe,dist/tui -DestinationPath dist/veasel-Windows.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: veasel-${{ runner.os }}
          path: dist/veasel-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: benchmark-session-store
          path: benchmark-results/session-store.json
          if-no-files-found: error
          retention-days: 30

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Scan repository files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
      - name: Upload scan report to code scanning
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
      - name: Retain pull request scan report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 7

  tui:
    name: Terminal client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: tui
      - run: bun run typecheck
        working-directory: tui
      - run: bun audit --audit-level=high
        working-directory: tui

  publish-prerelease:
    name: Publish verified prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-plan.outputs.released == 'true'
    needs: [release-plan, backend, security, tui]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: veasel-*
          path: release-assets
          merge-multiple: true
      - name: Build checksums and release manifest
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f \( -name 'veasel-Linux.tar.gz' -o -name 'veasel-macOS.tar.gz' -o -name 'veasel-Windows.zip' \) | sort)
          test "${#archives[@]}" -eq 3
          (
            cd release-assets
            sha256sum veasel-Linux.tar.gz veasel-macOS.tar.gz veasel-Windows.zip > ../SHA256SUMS
            sha256sum --check ../SHA256SUMS
          )
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          assets = []
          for path in sorted(Path('release-assets').iterdir()):
              if path.name not in {'veasel-Linux.tar.gz', 'veasel-macOS.tar.gz', 'veasel-Windows.zip'}:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({'name': path.name, 'sha256': digest})
          if len(assets) != 3:
              raise SystemExit('expected Linux, macOS, and Windows release archives')
          Path('release.json').write_text(json.dumps({
              'name': 'Veasel Code',
              'version': os.environ['RELEASE_VERSION'],
              'tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['RELEASE_COMMIT'],
              'channel': 'next',
              'prerelease': True,
              'assets': assets,
          }, indent=2) + '\n')
          PY
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* SHA256SUMS release.json --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* SHA256SUMS release.json \
              --target "$RELEASE_COMMIT" --title "Veasel Code $RELEASE_VERSION" \
              --generate-notes --prerelease
          fi
