name: CodeQL

# Semantic (source -> sink) analysis for the Desktop TypeScript surface,
# including the Electron main process and the renderer proxy trust boundary
# (desktop/electron/renderer-server.ts). Trivy in security.yml covers
# secrets/dependencies/misconfiguration; this covers dataflow classes.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
