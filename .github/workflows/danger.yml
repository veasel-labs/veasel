name: Pull request review policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  danger:
    name: TypeScript DangerJS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Run only policy code from the trusted PR base. Never execute the PR head
      # while this workflow holds a token that can write review comments.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: tools/danger/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/danger
      - run: npm run check
        working-directory: tools/danger
      - run: npm test
        working-directory: tools/danger
      - run: npx --prefix tools/danger danger ci --dangerfile=tools/danger/dangerfile.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
