name: Pull request review policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  danger:
    name: TypeScript DangerJS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Run only policy code from the trusted PR base. Never execute the PR head
      # while this workflow holds a token that can write review comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: tools/danger/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/danger
      - run: npm run check
        working-directory: tools/danger
      - run: npm test
        working-directory: tools/danger
      - run: npx --prefix tools/danger danger ci --dangerfile=tools/danger/dangerfile.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
