# Veasel Desktop journey ledger (epic #689).
#
# A journey is `ok` only with recorded evidence at a named build (packaged
# artifact hash + run record). Anything else stays partial, blocked, or
# not-implemented. Update the status and the evidence note together; the
# guard test in desktop/src/workflowLedger.test.ts pins the journeys that
# must not be over-claimed.
journeys:
  - id: desktop-proxy-trust-boundary
    status: ok
    evidence: "Backend caller auth (#740) merged on top of the #720 proxy gate; independently verified on published binaries v0.96.6-v0.96.9-next.0 (54/54 checks each): unauthenticated direct loopback calls return 401 on every route incl. SSE, health leaks no pid/version, token file is 0600, rotation invalidates the old token. Same-OS-user processes remain out of scope by documented design (docs/security/backend-caller-auth.md)."
  - id: focus-provider-turn
    status: ok
    evidence: "Packaged v0.96.9-next.0 AppImage (sha256 1f6256d5dda05c51f1cb381ec08f07fe23d9752f260c454eaee9f6417f0b0e6e), real OpenCode CLI through the Focus UI (2026-11-19): session started from the start form, streamed turn, operation resolved_provider=opencode, test independently red before and green after. Claude Code execution through the same UI was previously proven on v0.96.6. A newer Claude Code edit attempt on the verified v0.100.0-next.0 CLI archive is recorded separately as NOT VERIFIED because the final assistant text contradicted the persisted tool-effect record; see evidence/claude-code-2026-11-22.json."
  - id: claude-code-real-edit
    status: ok
    evidence: "Packaged v0.100.1-next.0 Linux AppImage (sha256 1b4477500f42143deb7770a1459fd9999cbe1ab0571170739f23d505365d41ce; source c20254af8267705432449102c091185445098d25): authenticated Claude Code 2.1.329 completed a Focus coding task in ask mode; backend persisted approved Write and Bash requests, the disposable parser test was independently red before and passed 7 assertions after, and only src.csv.js changed. The Playwright driver timed out during approval-dialog detachment; persisted approvals/operation state, diff, and independent test were checked directly. Model and monetary cost remain unknown. Full sanitized provenance: evidence/claude-packaged-2026-11-23.json. The earlier inconsistent CLI-only attempt remains retained as historical NOT VERIFIED evidence."
  - id: focus-approvals
    status: ok
    evidence: "Same packaged v0.96.9 run: edit approval approved in Focus -> applied (git diff oracle); second edit rejected -> file byte-identical; long shell cancelled via Stop -> CLI processes dead, backend operation cancelled. OpenCode ask-mode enforcement (#768) makes these approvals exist at all; before it, OpenCode applied edits with zero approvals."
  - id: tui-desktop-continuity
    status: ok
    evidence: "Packaged v0.97.0-next.0 (source 04ad0d6c, veasel-Linux.tar.gz sha256 ea2be208...): real OpenCode v2.3.2 turn through the backend API in ask mode (approvals approved, edit+shell), test independently red before and green after; then the packaged veasel-tui (PTY-driven, real terminal) opened the SAME session, submitted a follow-up message, and that message plus the assistant reply persisted in the durable backend transcript of that session. Fixture J9 additionally proves Desktop displays TUI-originated messages. Recorded 2026-11-20; driver kept outside the repo (real-provider quota), rerun on demand. Two honest caveats: one earlier attempt in the same session hit the CLI turn timeout (outcome recorded uncertain, not retried silently), and the TUI turn requires the session to carry a preferred provider/model route (per-message overrides alone leave continuing clients with 'No model provider is configured')."
  - id: linux-packaging
    status: ok
    evidence: "v0.96.9-next.0 (source 5efa6510) AppImage + DEB attached to the GitHub release, independently verified 54/54 (sums, manifest, bundled backend version, auth behaviour on the published binary). AppImage installed user-level (~/.local/opt/veasel-desktop, sha256 1f6256d5...), upgrade chain 0.96.4 -> 0.96.6 -> 0.96.7 launched healthy on one profile, 0.92.0 kept as rollback. Installers unsigned (signed:false in release.json); Windows unavailable, stated in the manifest."
  - id: verified-release
    status: partial
    evidence: "v0.97.0-next.0 (source 04ad0d6c) is the first complete cross-platform release: main CI 44652953187 fully green (Linux/macOS/Windows backends, Desktop packages on all three), veasel-Windows.zip and win-x64 installer published, and website (#218), Homebrew (#56) and AUR (#58) merged with SHA256SUMS-verified artifacts; stale bot PRs closed as superseded. Still partial: macOS/Windows packaged Desktop journeys are not yet recorded and all installers remain unsigned (signed:false in release.json; signing certificates are a human-owned dependency)."
