openapi: 3.1.0
info:
  title: Veasel Code API
  version: 0.3.1
  description: Local sessions, multi-provider chat, bounded workspace tools, durable approvals, local Agent Plugins and replayable events. Approved shell and trusted stdio MCP default to platform OS sandboxing and fail closed when the backend is unavailable. Explicit VEASEL_SHELL_SANDBOX=auto or VEASEL_MCP_STDIO_SANDBOX=auto permits unsandboxed fallback; off explicitly disables wrapping. Shell network is denied by default; MCP stdio network is shared inside its sandbox. Capabilities are advertised only when wrapping will run. AppContainer + Job is not Codex WFP/LPAC.
servers:
  - url: http://127.0.0.1:4097
    description: Loopback only; remote binding is not implemented.
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Implemented server capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /v1/config/model:
    get:
      operationId: getModelSettings
      description: Returns the active provider and saved model profiles. API keys are never returned; only api_key_saved is exposed.
      responses:
        '200':
          description: Sanitized provider profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettingsView'
    post:
      operationId: updateModelSettings
      description: Selects a provider and updates its model, endpoint, and optional API key. Empty api_key preserves an existing key; clear_api_key removes it. Credentials are stored locally with owner-only POSIX permissions, not encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSettingsInput'
      responses:
        '200':
          description: Updated sanitized provider profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettingsView'
        '400':
          description: Invalid provider, model, endpoint, or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/config/models:
    get:
      operationId: listProviderModels
      description: Fetches a bounded model list from the selected provider's configured endpoint. The request uses the provider credential held by the server; response bodies and credentials are not logged. Redirects and retries are disabled.
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Chat-and-tool-compatible provider model IDs and display names; unsupported model families may be omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogView'
        '400':
          description: Provider is invalid or credentials are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider endpoint did not return a supported model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: discoverProviderModels
      description: Fetches models before a profile is saved. Credentials and an optional endpoint override are accepted in the request body only; this operation never persists settings and never returns credentials. Requests use bounded timeouts and response size, and redirects are disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCatalogInput'
      responses:
        '200':
          description: Chat-and-tool-compatible provider model IDs and display names; unsupported model families may be omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogView'
        '400':
          description: Provider, endpoint, credentials, or request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provider endpoint did not return a supported model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins:
    get:
      operationId: listAgentPlugins
      description: Discovers bounded local Agent Plugins and standalone Agent Skills, returning metadata without skill instruction bodies. Standalone skills appear as synthetic catalog entries with origin=standalone. Operator-managed symlink packages appear with origin=link.
      parameters:
        - in: query
          name: directory
          required: false
          schema: { type: string }
          description: Project directory used for ancestor skill-root traversal; defaults to the server process working directory.
      responses:
        '200':
          description: Available plugins, standalone skill sources, and non-fatal discovery diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginCatalog'
        '500':
          description: Plugin directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-credentials:
    get:
      operationId: listMcpCredentials
      description: Lists named HTTP header credential sets persisted in `$VEASEL_DATA_DIR/mcp-credentials.json`. Secret values are never returned; only credential names and header names are shown. Streamable HTTP configured MCP servers may reference a credential by name; literal server headers win on case-sensitive key conflicts at connect time.
      responses:
        '200':
          description: Named MCP HTTP credentials (header names only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCredentialCatalog'
    post:
      operationId: upsertMcpCredential
      description: Adds or replaces a named set of HTTP headers for Streamable HTTP MCP. Values are stored locally with owner-only file permissions when the platform supports chmod. Does not perform OAuth or interactive authorization discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPCredentialInput'
      responses:
        '200':
          description: Created or updated credential view (header names only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCredentialView'
        '400':
          description: Invalid name or headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-credentials/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
    delete:
      operationId: removeMcpCredential
      description: Removes a named MCP HTTP credential. Configured servers that still reference the name fail at connect/trust until updated.
      responses:
        '200':
          description: Credential removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCredentialRemoval'
        '400':
          description: Name is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Credential not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-oauth/authorize:
    post:
      operationId: startMcpOauth
      description: Starts an MCP OAuth authorization-code + PKCE S256 flow. Persists the PKCE verifier in owner-only `$VEASEL_DATA_DIR/mcp-oauth-pending.json`. Returns the browser authorize URL and state; never returns the code verifier. `redirect_uri` must be loopback HTTP. Capability `mcp.oauth`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPOAuthAuthorizeInput'
      responses:
        '200':
          description: Authorize URL and public session fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPOAuthAuthorizeView'
        '400':
          description: Invalid endpoints, client_id, or redirect_uri.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-oauth/complete:
    post:
      operationId: completeMcpOauth
      description: >-
        Completes a pending MCP OAuth flow with an authorization `code`+`state`
        or a full loopback `callback_url`. Exchanges the code at the token
        endpoint and upserts `Authorization: Bearer` into the named MCP
        credential. Secret token values are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPOAuthCompleteInput'
      responses:
        '200':
          description: Credential view after token upsert (header names only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCredentialView'
        '400':
          description: Invalid callback, exchange failure, or credential name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pending OAuth session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-oauth/refresh:
    post:
      operationId: refreshMcpOauth
      description: >
        Refreshes a named MCP credential that previously received a refresh_token
        during authorize/complete. Uses owner-only `$VEASEL_DATA_DIR/mcp-oauth-refresh.json`
        for refresh metadata, exchanges `grant_type=refresh_token`, upserts
        `Authorization: Bearer` on the credential, and rotates stored refresh
        tokens when the server returns a new one. Secret values are never returned.
        Loopback listen remains headless (`veasel mcp oauth authorize --listen`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        '200':
          description: Credential view after refresh (header names only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPCredentialView'
        '400':
          description: Invalid credential or refresh exchange failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Refresh metadata not found for the credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: clearMcpOauthRefresh
      description: >
        Clears owner-only refresh metadata for a named MCP credential without
        deleting the credential headers. Idempotent when metadata is already
        absent. Secret values are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        '200':
          description: Refresh metadata cleared (or already absent).
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: string }
        '400':
          description: Invalid credential name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-servers:
    get:
      operationId: listConfiguredMcpServers
      description: Lists operator-configured MCP servers. User scope is always `$VEASEL_DATA_DIR/mcp-servers.json`. When `directory` is provided, also includes writable project-scope servers from `<directory>/.veasel/mcp-servers.json` and read-only imported portable `mcpServers` files (`.mcp.json`, `.cursor/mcp.json`). `.vscode/mcp.json` (`servers` key) is not imported. Secrets in headers are not returned; only header names, optional credential name, and URL origins are shown. Agent Plugin MCP servers remain listed under `/v1/plugins`.
      parameters:
        - in: query
          name: directory
          required: false
          schema: { type: string }
          description: Absolute or resolvable workspace directory. When set, project-scope and imported servers are included; `project_path` and `import_paths` are reported.
      responses:
        '200':
          description: Configured MCP servers (user, optional project, and optional project-import scopes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredMCPCatalog'
    post:
      operationId: upsertConfiguredMcpServer
      description: Adds or replaces a configured MCP server (stdio or streamable-http). Default scope is user (`$VEASEL_DATA_DIR/mcp-servers.json`). With `scope=project`, requires `directory` and writes `<directory>/.veasel/mcp-servers.json`. Does not download packages or run install scripts. Stdio commands must be a bare PATH name or absolute regular file; optional cwd must be an absolute directory. HTTP URLs follow the same origin/header rules as Agent Plugin MCP. Trust is separate (`POST /v1/sessions/{id}/mcp-servers` with `plugin_name=configured`). For a session workspace, a project-scoped server with the same name overrides the user-scoped entry in the plugin catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguredMCPServerInput'
      responses:
        '200':
          description: Created or updated configured MCP server (secrets omitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredMCPServerView'
        '400':
          description: Invalid name, transport, command, URL, headers, scope, or directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mcp-servers/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: query
        name: scope
        required: false
        schema: { type: string, enum: [user, project], default: user }
      - in: query
        name: directory
        required: false
        schema: { type: string }
        description: Required when scope is project.
    patch:
      operationId: patchConfiguredMcpServer
      description: Enables or disables a configured MCP server without deleting it. Disabled servers are omitted from the plugin catalog and cannot be trusted until re-enabled. Use `scope` and `directory` query parameters for project-scope updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguredMCPEnableInput'
      responses:
        '200':
          description: Updated configured MCP server view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredMCPServerView'
        '400':
          description: Invalid name, body, scope, or directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Configured MCP server not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: removeConfiguredMcpServer
      description: Removes a configured MCP server from user or project scope. Does not delete PLUGIN_DATA under `plugin-data/configured/<name>`.
      responses:
        '200':
          description: Server removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguredMCPRemoval'
        '400':
          description: Name, scope, or directory is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Configured MCP server not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins/components:
    get:
      operationId: listPluginComponents
      description: Lists durable per-plugin skill and MCP component enablement overrides persisted in `$VEASEL_DATA_DIR/plugin-components.json`. Absent entries default to enabled. Disabled components remain visible in `/v1/plugins` with `enabled=false` but cannot be trusted or session-activated.
      responses:
        '200':
          description: Component overrides (disabled entries and restored enabled removals).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginComponentCatalog'
    patch:
      operationId: patchPluginComponent
      description: Enables or disables one skill or MCP server inside an Agent Plugin package. Disabling refuses session skill activation and MCP trust for that component. Enabling removes the override (default on). Does not delete PLUGIN_DATA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginComponentToggleInput'
      responses:
        '200':
          description: Updated component view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginComponentView'
        '400':
          description: Invalid plugin, kind, name, or body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins/links:
    get:
      operationId: listPluginLinks
      description: Lists operator-managed Agent Plugin directory links under the plugin directory. Also restores missing symlinks from `$VEASEL_DATA_DIR/plugin-links.json` when the registered package path still validates. Returns absolute package paths for link management only; ordinary catalog responses still omit filesystem paths for package contents.
      responses:
        '200':
          description: Managed plugin links and non-fatal diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginLinkCatalog'
        '500':
          description: Plugin directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addPluginLink
      description: Validates an absolute local Agent Plugin package outside the plugin directory and creates a symlink named after the package. Idempotent when the same target is already linked. Optional `replace` updates an existing link that points elsewhere. Intended targets are also recorded in `$VEASEL_DATA_DIR/plugin-links.json` so a missing symlink can be restored on a later list. PLUGIN_DATA for that plugin name is preserved across relinks. Does not install from the network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginLinkInput'
      responses:
        '200':
          description: Created or existing managed plugin link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginLink'
        '400':
          description: Invalid path, package, or conflicting entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins/links/{name}:
    delete:
      operationId: removePluginLink
      description: Removes a managed plugin symlink by package name and drops the matching `$VEASEL_DATA_DIR/plugin-links.json` entry. Refuses to delete a non-link package directory. PLUGIN_DATA is left in place.
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Link removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginLinkRemoval'
        '400':
          description: Name is invalid or the entry is not a managed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Link not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/skills:
    get:
      operationId: listDiscoveredSkills
      description: Discovers standalone SKILL.md packages from project and user agent skill roots without requiring plugin.json. Returns metadata only; instruction bodies stay on disk until a session enables the skill or the model loads one with agent_skill_load.
      parameters:
        - in: query
          name: directory
          required: false
          schema: { type: string }
          description: Project directory used for ancestor skill-root traversal; defaults to the server process working directory.
      responses:
        '200':
          description: Discovered standalone skills, scanned roots, and diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsCatalog'
  /v1/sessions:
    get:
      operationId: listSessions
      responses:
        '200':
          description: Stored sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session and session.created event were stored atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid JSON or request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSession
      description: Deletes the session, its chat history, and dependent session state (operations, workspace edits, shell commands, MCP calls, traces). Workspace files on disk are never touched.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted session id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
                required: [deleted]
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unable to delete session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/usage:
    get:
      operationId: getUsage
      description: Aggregates provider-reported input and output tokens for completed turns across every session, with the same reported-only rules as the per-session summary. Includes groups by provider and model. Cost is a USD string when every usage-reported turn matches the pinned schedule; otherwise the literal unavailable.
      responses:
        '200':
          description: Global token usage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalUsageSummary'
        '500':
          description: Unable to read usage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/operations:
    get:
      operationId: listGlobalOperations
      description: >-
        Lists durable turn operations across all sessions, newest first. Pages
        are bounded to at most 100 rows and use the last operation id as the
        before cursor. Terminal rows follow the per-session retention bound;
        active jobs are included. The optional search term matches operation
        id, status, provider, model, error, or session title across retained
        history. A pruned cursor returns 400 so clients can restart from the
        newest page.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: query
          name: before
          description: Operation id returned as next_before by the preceding page.
          schema: { type: string, format: uuid }
        - in: query
          name: search
          description: Case-insensitive substring over operation id, status, provider, model, error, and session title; maximum 160 characters.
          schema: { type: string, maxLength: 160 }
      responses:
        '200':
          description: Bounded global operation history page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSessionOperationsPage'
        '400':
          description: Invalid limit/cursor or cursor no longer retained.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Unable to list global operations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/fork:
    post:
      operationId: forkSession
      description: Duplicates the session and its chat history under a new id (title suffixed with " (fork)") so an alternative direction can be explored without losing the original conversation. Operations, usage, workspace edits, and tool state stay with the source session; the fork starts with a clean execution ledger.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Forked session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unable to fork session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/usage:
    get:
      operationId: getSessionUsage
      description: Aggregates provider-reported input and output tokens for completed turns in this session. When adapters saw provider cache fields, also aggregates cache_read_tokens and cache_creation_tokens (provider-reported only; never estimated savings). Turns without adapter-reported usage are counted but do not contribute token totals. Cost is a USD string when every usage-reported turn matches the pinned schedule; otherwise the literal unavailable. Bytes/4 bounds elsewhere remain separate from these cache claims.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session token usage summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUsageSummary'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMessages
      description: Returns up to 100 persisted messages in chronological order, newest page first. Use the first message ID from a page as the exclusive before cursor to fetch the preceding page. Omitting before returns the latest page; limit defaults to 100.
      parameters:
        - in: query
          name: before
          required: false
          description: Positive message ID; return messages with lower IDs.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          required: false
          description: Page size, default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Session chat history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatTurn'
        '400':
          description: Invalid cursor or page size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: sendSessionMessage
      description: >-
        Completes and atomically stores a user and assistant turn in the
        session. Provider-native tool calls may list/read/search bounded
        workspace files and create durable single-file edit proposals.
        Requested workspace content is sent to the configured provider;
        proposed file contents are not written before explicit approval.
        Assistant text streams as durable assistant.delta events on
        /v1/events. Successful turns atomically persist history and a
        session.turn_completed event; failed or cancelled turns persist a
        terminal event with a safe public error. Send Prefer: respond-async to
        receive 202 immediately and follow that event or query the durable
        operation resource; without this preference
        the request waits and returns the full ChatExchange. Send a unique
        X-Veasel-Operation-ID UUID to allow cancellation; turns have a
        two-minute deadline. Set collect_trace true to opt into persisting an
        ATIF v1.8 trajectory for a successful operation; it includes the prompt
        and tool I/O, and should be treated as sensitive workspace content.
      parameters:
        - in: header
          name: X-Veasel-Operation-ID
          required: false
          description: Caller-generated UUID used by the session cancellation endpoint. Reusing an active ID returns 409.
          schema:
            type: string
            format: uuid
        - in: header
          name: Prefer
          required: false
          description: Use respond-async (case-insensitive per RFC 7240) to return an operation ID immediately. Follow its terminal event or query /v1/sessions/{id}/operations/{operation_id}. Omit to wait for a ChatExchange response.
          schema:
            type: string
            example: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '202':
          description: >-
            The turn is persisted as queued with its request payload before the
            response. Query the session operation resource, list operations, or
            follow session.turn_queued / session.turn_started / session.turn_completed.
            Queued jobs resume after restart. Running or cancelling work is
            classified uncertain and is never replayed.
          headers:
            Preference-Applied:
              description: Confirms that respond-async was applied.
              schema:
                type: string
                example: respond-async
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTurnAccepted'
        '200':
          description: Persisted exchange and the provider/model that answered it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchange'
        '400':
          description: Invalid or oversized message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured model provider request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider is not configured or all provider slots are occupied; retry after one second when Retry-After is present.
          headers:
            Retry-After:
              description: Seconds to wait before retrying an overloaded provider request.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The two-minute turn deadline expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The active turn was cancelled or the operation identifier is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/operations:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSessionOperations
      description: >-
        Lists durable session turn operations newest-last. Includes queued jobs
        that survive restart and terminal statuses retained under the per-session
        bound.
      responses:
        '200':
          description: Session operations in creation order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionOperation'
        '404':
          description: Session was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/operations/{operation_id}:

    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSessionOperation
      description: >-
        Returns durable async session turn status. The operation belongs to the
        session in the path. Queued jobs retain request payloads and resume after
        restart. A server restart classifies running or cancelling work as
        uncertain and never repeats provider or tool effects.
      responses:
        '200':
          description: Current operation status and safe terminal metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOperation'
        '404':
          description: Session or operation was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/operations/{operation_id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelSessionTurn
      description: Cancels an active session turn, including one waiting for its serialized session slot. The turn request returns 409; provider transports retain their provider slot until bounded network cleanup finishes.
      responses:
        '202':
          description: Cancellation was signaled.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: { type: string, format: uuid }
                  status: { type: string, enum: [cancelling, completed, cancelled, failed, uncertain] }
        '404':
          description: Session or active operation not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/operations/{operation_id}/result:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSessionOperationResult
      description: Returns the assistant text reconstructed from persisted deltas for this exact operation, avoiding ambiguity when turns share a session.
      responses:
        '200':
          description: Completed assistant result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionOperationResult' }
        '404':
          description: Session operation was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Operation has not completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/operations/{operation_id}/cancel:
    parameters:
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelChatCompletion
      description: Cancels an active direct chat completion. The completion request returns 409; provider transports retain their provider slot until bounded network cleanup finishes.
      responses:
        '202':
          description: Cancellation was signaled.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: { type: string, format: uuid }
                  status: { type: string, const: cancelling }
        '404':
          description: Active operation not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/skills:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionSkills
      description: Returns the Agent Plugin skills enabled for this session.
      responses:
        '200':
          description: Active skill identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPluginSkill'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: setSessionSkill
      description: Enables or disables a validated Agent Plugin skill for the session. Enabled instructions are included as untrusted system context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSessionPluginSkill'
      responses:
        '200':
          description: Updated active skill identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPluginSkill'
        '400':
          description: Invalid request or skill instructions cannot be safely loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or plugin skill not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/skills/invoke:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: invokeSessionSkill
      description: >
        Queues a one-shot skill body injection for the next session turn without
        lasting enablement. The TUI exposes `/skill run <source>/<skill>` and
        `$source/skill`. Explicit invoke is the trust act for project-scoped
        skills; content remains untrusted and is never executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plugin_name, skill_name]
              properties:
                plugin_name:
                  type: string
                skill_name:
                  type: string
      responses:
        '200':
          description: Queued one-shot invoke and current pending queue.
          content:
            application/json:
              schema:
                type: object
                required: [plugin_name, skill_name, pending]
                properties:
                  plugin_name:
                    type: string
                  skill_name:
                    type: string
                  pending:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionPluginSkill'
        '400':
          description: Invalid request or skill instructions cannot be safely loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or plugin skill not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Pending one-shot invoke queue is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/mcp-servers:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMCPServers
      description: Returns MCP servers explicitly trusted for this session.
      responses:
        '200':
          description: Trusted MCP server identifiers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionPluginMCPServer' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: setSessionMCPServerTrust
      description: Trusts or revokes a stdio or Streamable HTTP MCP server for this session. A trusted server connects or launches on the next model turn. Stdio uses the Veasel process user's OS privileges; HTTP is pinned to its configured origin and redirects are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSessionPluginMCPServer' }
      responses:
        '200':
          description: Updated trusted MCP server identifiers.

  /v1/sessions/{id}/mcp-tool-calls:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listMcpToolCallApprovals
      description: Lists up to 50 recent MCP call proposals and outcomes without returning argument contents. Pending calls have not reached their MCP server; inspect one through the detail route.
      responses:
        '200':
          description: Durable MCP tool call history.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/PluginMCPToolCallSummary' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/mcp-tool-calls/{call_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: inspectMcpToolCallApproval
      description: Returns the exact bounded MCP tool arguments and durably records inspection before approval.
      responses:
        '200':
          description: Exact tool arguments and durable call state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginMCPToolCallApproval' }
        '404':
          description: Session or call not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/mcp-tool-calls/{call_id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveMcpToolCall
      description: Records one-time approval after inspection. The waiting model turn then invokes the exact MCP tool once; the API request does not execute the tool itself.
      responses:
        '200':
          description: The waiting call is approved and may begin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginMCPToolCallApproval' }
        '404':
          description: Session or call not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Call has not been inspected or is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/mcp-tool-calls/{call_id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectMcpToolCall
      description: Durably rejects a pending MCP call. The waiting provider turn receives a rejection error; Veasel does not retry the call.
      responses:
        '200':
          description: The call is rejected and will not reach its MCP server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginMCPToolCallApproval' }
        '404':
          description: Session or call not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Call is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionPluginMCPServer' }
        '400':
          description: Invalid request or unsupported MCP transport.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session or MCP server not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/files:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWorkspaceFiles
      description: Lists at most 500 regular files beneath the session workspace. Common generated and dependency directories and all symbolic links are skipped.
      responses:
        '200':
          description: Sorted relative workspace paths; truncated is true if any configured listing limit was reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileList' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/file:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: readWorkspaceFile
      description: Reads one text file of at most 512000 bytes after resolving its path beneath the canonical session root. Outside-root symlinks, binary files, and parent traversal are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceFileInput' }
      responses:
        '200':
          description: Relative file path and UTF-8 text content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileContent' }
        '400':
          description: Invalid, oversized, binary, or out-of-root path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/search:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: searchWorkspace
      description: Searches literal, case-sensitive text beneath the session root, with bounded file, byte, and result counts. Binary and oversized files are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSearchInput' }
      responses:
        '200':
          description: Matching paths, one-based line numbers, and bounded line excerpts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSearchResult' }
        '400':
          description: Invalid or oversized search query.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/git/worktrees:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listSessionGitWorktrees
      description: Lists git worktrees for the session workspace by reading the repository git directory (no `git` subprocess). Includes the main checkout and linked worktrees under `.git/worktrees/`. Reports HEAD/branch when present, whether well-known git lock files exist, and `missing` when a linked worktree checkout directory is gone (stale admin entry).
      responses:
        '200':
          description: Discovered worktrees (capped).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceGitWorktreeCatalog' }
        '400':
          description: Workspace is not a readable git checkout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: addSessionGitWorktree
      description: Adds a linked git worktree via `git worktree add` (argv only, no shell), or prunes stale worktree admin entries when `prune` is true (`git worktree prune`). Add requires an absolute unused path whose parent exists, and either `branch` (existing) or `new_branch` (`-b`). Prune must not combine with path/branch fields and returns the refreshed worktree catalog. Refuses when well-known git lock files are present. Runs with a bounded timeout against the repository main checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceGitWorktreeAddInput' }
      responses:
        '200':
          description: Created worktree metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceGitWorktree' }
        '400':
          description: Invalid path/branch, git unavailable, lock held, or git failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: removeSessionGitWorktree
      description: Removes a linked git worktree via `git worktree remove` (argv only, no shell). The main checkout cannot be removed. Optional `force` maps to `--force`. Refuses when well-known git lock files are present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceGitWorktreeRemoveInput' }
      responses:
        '200':
          description: Worktree removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceGitWorktreeRemoval' }
        '400':
          description: Invalid path, lock held, or git failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session or linked worktree not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: patchSessionGitWorktree
      description: Locks or unlocks a git worktree via `git worktree lock|unlock` (argv only, no shell). Optional `reason` is accepted only when locking. Refuses when well-known concurrent git lock files are present.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceGitWorktreeLockInput' }
      responses:
        '200':
          description: Updated worktree metadata after lock or unlock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceGitWorktree' }
        '400':
          description: Invalid path/reason, lock held, or git failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session or worktree not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/map:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: hint
        required: false
        description: Optional UTF-8 ranking hint (paths or identifiers). Bounded to the workspace search query size.
        schema: { type: string, maxLength: 256 }
    get:
      operationId: getWorkspaceRepositoryMap
      description: Builds a deterministic extractive repository map for the session workspace. Ranking uses path/identifier hints when provided. The response reports measured UTF-8 bytes and a conservative bytes/4 token bound; it is not tree-sitter/PageRank parity with Aider and does not claim provider token savings. Map text is untrusted.
      responses:
        '200':
          description: Measured repository map text and ranking metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceRepositoryMapResponse' }
        '400':
          description: Hint exceeds the size limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The workspace could not be scanned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWorkspaceEdits
      description: Lists recent workspace edit proposals and their durable review states. Proposal content is never applied by listing.
      responses:
        '200':
          description: Recent review proposals.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/WorkspaceEditSummary' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: proposeWorkspaceEdit
      description: Stores a unified diff for one existing file or a new file in an existing directory. This operation never writes to the workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceEditInput' }
      responses:
        '201':
          description: Diff saved for explicit user review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditProposal' }
        '400':
          description: Invalid path, text, or proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: The session has reached its pending proposal limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits/{edit_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: edit_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWorkspaceEdit
      description: Returns one proposal diff and durably records that the review view was opened before approval.
      responses:
        '200':
          description: Diff and durable proposal state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditProposal' }
        '404':
          description: Session or proposal not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits/{edit_id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: edit_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveWorkspaceEdit
      description: Durably records approval, checks that the file still matches the reviewed snapshot, then applies the file replacement. An interrupted application is never replayed automatically.
      responses:
        '200':
          description: The approved file edit was applied and recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditAction' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal has not been reviewed or is no longer pending, or the file changed or became unsafe since review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The write outcome is uncertain. Inspect the workspace before proceeding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits/{edit_id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: edit_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectWorkspaceEdit
      description: Durably rejects a pending proposal without changing the workspace.
      responses:
        '200':
          description: The proposal was rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditAction' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal is not pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listShellCommandProposals
      description: Lists recent durable command proposals and outcomes.
      responses:
        '200':
          description: Recent command proposals.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/ShellCommand' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands/{command_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: command_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: reviewShellCommandProposal
      description: Returns the exact command, cwd and timeout, and durably records that the review view was opened.
      responses:
        '200':
          description: Exact command awaiting approval or its persisted outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellCommand' }
        '404':
          description: Session or proposal not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands/{command_id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: command_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveShellCommandProposal
      description: Durably records explicit approval before running the exact reviewed command. Shell execution defaults to the platform OS sandbox. An unset or invalid VEASEL_SHELL_SANDBOX fails closed if the backend is unavailable; explicit auto permits unsandboxed fallback and off disables wrapping. Shell network is denied unless VEASEL_SHELL_SANDBOX_NETWORK=allow. Bounded timeout and output apply; execution is never retried after interruption.
      responses:
        '200':
          description: Command outcome and bounded output.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellCommand' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal has not been reviewed or is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: The bounded command execution capacity is full.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands/{command_id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: command_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectShellCommandProposal
      description: Durably rejects a command proposal without executing it.
      responses:
        '200':
          description: The command was rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditAction' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal is not pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Sends bounded system, user, and assistant messages to the configured model provider. Send a unique X-Veasel-Operation-ID UUID and use /v1/operations/{operation_id}/cancel to cancel it. Turns have a two-minute deadline.
      parameters:
        - in: header
          name: X-Veasel-Operation-ID
          required: false
          description: Caller-generated UUID used by the direct completion cancellation endpoint. Reusing an active ID returns 409.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionInput'
      responses:
        '200':
          description: Completed model response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionOutput'
        '400':
          description: Invalid or oversized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured model provider request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider is not configured or all provider slots are occupied; retry after one second when Retry-After is present.
          headers:
            Retry-After:
              description: Seconds to wait before retrying an overloaded provider request.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The two-minute turn deadline expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The active turn was cancelled or the operation identifier is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events:
    get:
      operationId: streamEvents
      description: >-
        Replays persisted events newer than Last-Event-ID, then streams new
        events. Catch-up reads return at most 500 events per poll so reconnect
        clients can drain a large backlog faster than the previous 100-event
        page. During quiet periods the stream emits `event: heartbeat` with
        `data: {}` about every 15 seconds so proxies and clients can detect a
        live connection without inventing session events. During session turns,
        assistant.delta events include data.operation_id and data.delta. Async
        turns begin with session.turn_started and end with session.turn_completed.
        Completion includes operation_id and status; successful events include
        provider and model, and when a provider adapter reported token counts
        they also include usage_reported with input_tokens and output_tokens.
        When the provider payload included cache fields, completion also
        includes cache_reported with cache_read_tokens and cache_creation_tokens
        (provider-reported only). Failed events include a safe public error, and
        uncertain events indicate the process stopped before a result was
        recorded. When measured UTF-8 provider-request payload pressure rises,
        session.compaction records measured bytes_before/bytes_after, a
        conservative bytes/4 token bound, summarizer mode (extractive, native,
        llm, or *_fallback_extractive), optional provider usage when a summarizer
        adapter reported it, and an untrusted summary preview; durable chat
        history rows are not deleted. When a turn injects a repository map into
        the system prompt, session.repository_map records measured map bytes, a
        bytes/4 token bound, file/symbol counts, and an untrusted preview. Cost
        is never estimated.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          description: Digit-only non-negative event ID cursor (no sign, spaces, or leading zeros except `0`); defaults to `0` when omitted.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*)$'
      responses:
        '200':
          description: >-
            Server-sent event stream using event IDs as resumable cursors. Each
            event data field is a JSON Event object; assistant.delta carries
            operation_id and delta, session.turn_started announces a durable
            operation, session.compaction reports measured request-payload
            compaction, session.repository_map reports an injected extractive
            workspace map, and session.turn_completed carries its final status.
            Quiet streams also emit heartbeat events (`event: heartbeat`,
            `data: {}`) about every 15 seconds.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Last-Event-ID is not a digit-only non-negative integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [healthy, version]
      properties:
        healthy:
          type: boolean
        version:
          type: string
    Capabilities:
      type: object
      required: [api_version, features]
      properties:
        api_version:
          type: string
        features:
          type: array
          description: Includes mcp.stdio.sandbox.bubblewrap, mcp.stdio.sandbox.seatbelt, and mcp.stdio.sandbox.windows when VEASEL_MCP_STDIO_SANDBOX is require or auto and the platform wrap will run (default require refuses to start without a backend; off stays unsandboxed without advertising). Includes sessions.operations.list and sessions.operations.durable_queue for Prefer respond-async turns that persist as queued, resume after restart, and expose GET /v1/sessions/{id}/operations. sessions.operations.trace.atif_v1_8 covers opt-in successful operation trajectory export. Traces may contain prompt and workspace content. sessions.usage.prompt_cache means adapters persist provider-reported cache_read/cache_creation counters when present (OpenAI cached_tokens subset, Anthropic disjoint cache_*_input_tokens, Gemini cachedContentTokenCount); absent fields stay unreported and Veasel never invents savings. provider.anthropic.prompt_cache means Anthropic Messages requests emit cache_control markers (top-level automatic ephemeral plus system-block breakpoint when a system prompt is present); controlled by VEASEL_ANTHROPIC_PROMPT_CACHE (auto/1h/off). provider.openai.prompt_cache means OpenAI Chat Completions (catalog openai) and Responses (catalog openai-responses) requests emit prompt_cache_key (default veasel; override VEASEL_OPENAI_PROMPT_CACHE_KEY) and optional prompt_cache_retention when VEASEL_OPENAI_PROMPT_CACHE is 24h or in_memory; controlled by VEASEL_OPENAI_PROMPT_CACHE (auto/24h/in_memory/off). Not applied to Meta or generic openai-compatible gateways. provider.gemini.prompt_cache means Gemini generateContent requests emit cachedContent when VEASEL_GEMINI_CACHED_CONTENT names a resource and VEASEL_GEMINI_PROMPT_CACHE is not off; create/expire use explicit helpers (POST/DELETE cachedContents) and are not on the turn path. Request markers/keys enable caching attempts; they are not proof of cache hits—hits still require provider-reported cache fields. Also includes agent.tools.skill_load and agent.tools.skill_read_resource when model support is configured. skill_load lets the model fetch a discovered skill body without prior session enablement; skill_read_resource then reads bounded UTF-8 files from session-enabled or turn-loaded skill directories. Neither tool executes files. session.compaction is present when the runtime may replace older in-flight provider messages with an untrusted summary under measured UTF-8 payload pressure; it does not delete durable chat history or invent provider token savings. session.compaction.summarizer appears when VEASEL_SESSION_COMPACTION_SUMMARIZER is native or llm (structured local summary or one no-tools LLM completion with extractive fallback). workspace.repository_map and session.repository_map advertise the extractive repository map (GET /v1/sessions/{id}/workspace/map and optional turn injection); sizes are measured UTF-8 bytes plus a bytes/4 bound, not provider usage or tree-sitter/PageRank parity.
