          items:
            type: object
            required: [id, name, description, protocol, base_url, environment_key, requires_api_key]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              protocol: { type: string, enum: [openai-compatible, openai-responses, anthropic, gemini] }
              base_url: { type: string }
              environment_key: { type: string }
              documentation_url: { type: string }
              requires_api_key: { type: boolean }
        configured_providers:
          type: array
          description: Provider IDs with a saved or environment credential. Secret values are never included.
          items: { type: string }
    ModelCatalogView:
      type: object
      required: [provider, models]
      properties:
        provider: { type: string }
        models:
          type: array
          description: Chat-and-tool-compatible models exposed by the provider adapter. Unsupported output modalities may be omitted.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
              input_per_mtok:
                type: number
                description: Optional pinned USD per million input tokens from Veasel's cost schedule. Omitted when the model is unpriced.
              output_per_mtok:
                type: number
                description: Optional pinned USD per million output tokens from Veasel's cost schedule. Omitted when the model is unpriced.
              cost_unit:
                type: string
                description: Present with rate fields when pinned (usd_per_million_tokens). Never invents rates.
    ModelCatalogInput:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
          description: Provider catalog ID.
        base_url:
          type: string
          maxLength: 2048
          description: Optional HTTPS or loopback HTTP endpoint override.
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: Optional transient key used for this discovery request. Not persisted or returned.
        clear_api_key:
          type: boolean
          default: false
          description: Ignore an existing saved key during discovery; a provider environment key still takes precedence.
    PluginCatalog:
      type: object
      required: [plugins, diagnostics]
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginCatalogEntry'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/PluginDiagnostic'
    PluginCatalogEntry:
      type: object
      required: [name, version, description, skills, mcp_servers, diagnostics]
      properties:
        name: { type: string }
        version: { type: string }
        description: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/PluginSkillSummary' }
        mcp_servers:
          type: array
          description: Validated declarations. Stdio and Streamable HTTP servers can be trusted per session; trusted servers may connect during the next model turn. Redirects are refused for HTTP servers.
          items: { $ref: '#/components/schemas/PluginMCPServerSummary' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/PluginDiagnostic' }
        veasel_extension:
          $ref: '#/components/schemas/VeaselCodeExtension'
          description: Present only when the package declares a valid Veasel client extension. Omitted otherwise.
        origin:
          type: string
          description: Set to standalone for synthetic SKILL.md entries, link for operator-managed symlink packages, or configured for user-scoped MCP servers from `/v1/mcp-servers`; omitted for ordinary in-directory Agent Plugin packages.
    ConfiguredMCPCatalog:
      type: object
      required: [scope, servers]
      properties:
        scope:
          type: string
          enum: [user, mixed]
          description: >-
            `user` when only `$VEASEL_DATA_DIR/mcp-servers.json` is considered;
            `mixed` when a workspace directory also contributes project or
            imported servers.
        path:
          type: string
          description: Absolute path of the user-scope JSON file when available.
        project_path:
          type: string
          description: Absolute path of `<workspace>/.veasel/mcp-servers.json` when a workspace directory was supplied.
        import_paths:
          type: array
          items: { type: string }
          description: Absolute paths of read-only imported portable mcpServers files (`.mcp.json`, `.cursor/mcp.json`) when present.
        servers:
          type: array
          items:
            $ref: '#/components/schemas/ConfiguredMCPServerView'
    ConfiguredMCPServerView:
      type: object
      required: [name, scope, enabled, transport]
      properties:
        name: { type: string }
        scope: { type: string, enum: [user, project, project-import] }
        config_file:
          type: string
          description: Relative or basename path of the file that defined this server (for example `.veasel/mcp-servers.json` or `.mcp.json`).
        enabled: { type: boolean }
        transport: { type: string, enum: [stdio, streamable-http] }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        cwd: { type: string }
        env_keys:
          type: array
          items: { type: string }
          description: Environment variable names only; values are never returned.
        url_origin: { type: string }
        header_names:
          type: array
          items: { type: string }
          description: Literal header names only; values are never returned. Named credential header names are not duplicated here.
        credential:
          type: string
          description: Optional name of a `/v1/mcp-credentials` entry merged into Streamable HTTP headers at connect time.
    ConfiguredMCPServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        transport: { type: string, enum: [stdio, streamable-http] }
        command: { type: string, description: Bare executable name or absolute file path for stdio. }
        args:
          type: array
          items: { type: string }
        cwd: { type: string, description: Optional absolute working directory for stdio. }
        env:
          type: object
          additionalProperties: { type: string }
        url: { type: string, description: Absolute HTTP(S) URL for streamable-http. }
        headers:
          type: object
          additionalProperties: { type: string }
        credential:
          type: string
          description: Optional `/v1/mcp-credentials` name for streamable-http only. Stdio rejects credential.
        enabled: { type: boolean, default: true }
        scope: { type: string, enum: [user, project], default: user }
        directory: { type: string, description: Workspace directory required when scope is project. }
    MCPCredentialCatalog:
      type: object
      required: [credentials]
      properties:
        path: { type: string, description: Absolute path of mcp-credentials.json when available. }
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/MCPCredentialView'
    MCPCredentialView:
      type: object
      required: [name, header_names]
      properties:
        name: { type: string }
        header_names:
          type: array
          items: { type: string }
          description: Header names only; values are never returned.
        oauth_refresh:
          type: boolean
          description: True when owner-only refresh metadata exists for this credential. Never exposes refresh token values.
    MCPCredentialInput:
      type: object
      required: [name, headers]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Validated HTTP headers stored locally; values are never returned by list/get views.
    MCPCredentialRemoval:
      type: object
      required: [removed]
      properties:
        removed: { type: string }
    MCPOAuthAuthorizeInput:
      type: object
      required: [credential, authorization_endpoint, token_endpoint, client_id, redirect_uri]
      properties:
        credential: { type: string, description: Named MCP credential that will receive Authorization Bearer after completion. }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        client_id: { type: string }
        redirect_uri: { type: string, description: Loopback HTTP redirect URI (127.0.0.1/localhost/::1). }
        scope: { type: string }
        resource: { type: string, description: Optional RFC 8707 resource parameter. }
    MCPOAuthAuthorizeView:
      type: object
      required: [credential, state, authorize_url, redirect_uri, code_challenge_method]
      properties:
        credential: { type: string }
        state: { type: string }
        authorize_url: { type: string }
        redirect_uri: { type: string }
        code_challenge_method: { type: string, enum: [S256] }
    MCPOAuthCompleteInput:
      type: object
      required: [credential]
      properties:
        credential: { type: string }
        state: { type: string, description: Required when callback_url is omitted. }
        code: { type: string, description: Required when callback_url is omitted. }
        callback_url: { type: string, description: Full loopback redirect URL including query; alternative to code+state. }
    ConfiguredMCPEnableInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ConfiguredMCPRemoval:
      type: object
      required: [removed]
      properties:
        removed: { type: string }
    PluginComponentCatalog:
      type: object
      required: [components]
      properties:
        path: { type: string, description: Absolute path of plugin-components.json when available. }
        components:
          type: array
          items: { $ref: '#/components/schemas/PluginComponentView' }
    PluginComponentView:
      type: object
      required: [plugin, kind, name, enabled]
      properties:
        plugin: { type: string }
        kind: { type: string, enum: [skill, mcp] }
        name: { type: string }
        enabled: { type: boolean }
    PluginComponentToggleInput:
      type: object
      required: [plugin, kind, name, enabled]
      properties:
        plugin: { type: string }
        kind: { type: string, enum: [skill, mcp] }
        name: { type: string }
        enabled: { type: boolean }
    PluginLinkCatalog:
      type: object
      required: [links, diagnostics]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/PluginLink'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/PluginDiagnostic'
    PluginLink:
      type: object
      required: [name, path, skill_count, mcp_server_count]
      properties:
        name: { type: string }
        path:
          type: string
          description: Absolute filesystem path of the linked Agent Plugin package.
        version:
          type: string
          description: Optional package version from plugin.json when present.
        description:
          type: string
          description: Optional package description from plugin.json when present.
        display_name:
          type: string
          description: Optional com.veasel.code display_name when present.
        skill_count:
          type: integer
          minimum: 0
          description: Number of valid Skill components discovered in the package.
        mcp_server_count:
          type: integer
          minimum: 0
          description: Number of accepted MCP servers discovered in the package.
    PluginLinkInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute path to a local Agent Plugin package directory outside the plugin directory.
        replace:
          type: boolean
          default: false
          description: When true, replace an existing managed link that already points at a different package path.
    PluginLinkRemoval:
      type: object
      required: [removed]
      properties:
        removed: { type: string }
    SkillsCatalog:
      type: object
      required: [skills, diagnostics, roots]
      properties:
        skills:
          type: array
          items: { $ref: '#/components/schemas/StandaloneSkillSummary' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/PluginDiagnostic' }
        roots:
          type: array
          items: { $ref: '#/components/schemas/StandaloneSkillRootSummary' }
    StandaloneSkillSummary:
      type: object
      required: [key, name, description, source, scope, root, allowed_tools_declared, allowed_tools]
      properties:
        key: { type: string, description: 'source/name identifier used with session skill enablement' }
        name: { type: string }
        description: { type: string }
        source: { type: string, description: 'agents, claude, cursor, opencode, configured, ...' }
        scope: { type: string, description: 'project, user, or configured' }
        root: { type: string, description: Absolute discovery root that contained the skill }
        allowed_tools_declared: { type: boolean }
        allowed_tools:
          type: array
          items: { type: string }
    StandaloneSkillRootSummary:
      type: object
      required: [path, source, scope, label]
      properties:
        path: { type: string }
        source: { type: string }
        scope: { type: string }
        label: { type: string }
    VeaselCodeExtension:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          description: Optional label from extensions["com.veasel.code"]. It does not replace the plugin name used in commands.
        has_directory:
          type: boolean
          description: True when a com.veasel.code directory resolves inside the package. Contents are not returned or executed.
    PluginSkillSummary:
      type: object
      required: [name, description, allowed_tools_declared, allowed_tools, enabled]
      properties:
        name: { type: string }
        description: { type: string }
        allowed_tools_declared:
          type: boolean
          description: True when the skill declares the experimental Agent Skills allowed-tools field, including when its list is empty.
        allowed_tools:
          type: array
          description: Sorted, deduplicated tool names declared by the skill. An empty list with allowed_tools_declared true restricts the skill to no tools.
          items: { type: string }
        source:
          type: string
          description: Present for standalone discoveries; identifies the agent skill root family.
        scope:
          type: string
          description: Present for standalone discoveries; project, user, or configured.
        enabled:
          type: boolean
          description: False when an operator disabled this skill via `/v1/plugins/components`.
    PluginMCPServerSummary:
      type: object
      required: [name, transport, command, url_origin, header_count, header_names, enabled]
      properties:
        name: { type: string }
        transport: { type: string }
        command:
          type: string
          description: Executable token declared by the plugin, or a resolved package path for a ./ command; empty for other transports.
        url_origin:
          type: string
          description: Lowercase scheme and host with port, if present; path and query are omitted.
        header_count:
          type: integer
          minimum: 0
          description: Number of configured headers.
        header_names:
          type: array
          description: Sorted configured header names; header values are not returned.
          items: { type: string }
    PluginDiagnostic:
      type: object
      required: [component, message]
      properties:
        component: { type: string }
        message: { type: string }
    SessionPluginSkill:
      type: object
      required: [plugin_name, skill_name]
      properties:
        plugin_name: { type: string }
        skill_name: { type: string }
    SessionPluginMCPServer:
      type: object
      required: [plugin_name, server_name]
      properties:
        plugin_name: { type: string }
        server_name: { type: string }
    ReviewSandboxPreview:
      type: object
      required: [mode, will_wrap, backend, network]
      description: Computed at response time from VEASEL_SHELL_SANDBOX or VEASEL_MCP_STDIO_SANDBOX and platform backends. Not persisted. network is deny|allow for wrapped shell (VEASEL_SHELL_SANDBOX_NETWORK), shared for wrapped MCP stdio, and host when unsandboxed.
      properties:
        mode: { type: string, enum: [off, auto, require] }
        will_wrap: { type: boolean, description: True only when this process will wrap on the current platform. }
        backend: { type: string, enum: [none, bubblewrap, seatbelt, windows] }
        network: { type: string, enum: [deny, allow, shared, host], description: Effective network posture for the reviewed process. }
    PluginMCPToolCallApproval:
      type: object
      required: [id, operation_id, plugin_name, server_name, tool_name, arguments_json, status, reviewed_at, created_at, updated_at, stdio_sandbox]
      properties:
        id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        plugin_name: { type: string }
        server_name: { type: string }
        tool_name: { type: string }
        arguments_json: { type: string, description: Exact JSON object sent by the model, limited to 32768 UTF-8 bytes; review as untrusted input. }
        status:
          type: string
          enum: [pending, approved, running, completed, rejected, failed, cancelled, uncertain]
        reviewed_at: { type: string, description: Empty until the detail view records inspection. }
        created_at: { type: string }
        updated_at: { type: string }
        stdio_sandbox:
          $ref: '#/components/schemas/ReviewSandboxPreview'
          description: Preview for trusted stdio MCP processes. Streamable HTTP ignores the wrap; default mode is off.
    PluginMCPToolCallSummary:
      type: object
      required: [id, operation_id, plugin_name, server_name, tool_name, arguments_bytes, status, reviewed_at, created_at, updated_at, stdio_sandbox]
      properties:
        id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        plugin_name: { type: string }
        server_name: { type: string }
        tool_name: { type: string }
        arguments_bytes: { type: integer, minimum: 2, maximum: 32768, description: UTF-8 byte length of the withheld tool arguments. Use the detail route to inspect them. }
        status:
          type: string
          enum: [pending, approved, running, completed, rejected, failed, cancelled, uncertain]
        reviewed_at: { type: string, description: Empty until the detail view records inspection. }
        created_at: { type: string }
        updated_at: { type: string }
        stdio_sandbox:
          $ref: '#/components/schemas/ReviewSandboxPreview'
          description: Preview for trusted stdio MCP processes. Streamable HTTP ignores the wrap; default mode is off.
    SetSessionPluginMCPServer:
      type: object
      required: [plugin_name, server_name, trusted]
      properties:
        plugin_name: { type: string, minLength: 1, maxLength: 64 }
        server_name: { type: string, minLength: 1, maxLength: 256 }
        trusted: { type: boolean }
    SetSessionPluginSkill:
      type: object
      required: [plugin_name, skill_name, enabled]
      properties:
        plugin_name: { type: string, minLength: 1 }
        skill_name: { type: string, minLength: 1 }
        enabled: { type: boolean }
    WorkspaceFileList:
      type: object
      required: [files, truncated]
      properties:
        files:
          type: array
          maxItems: 500
          items: { type: string }
        truncated: { type: boolean }
    WorkspaceFileInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
    WorkspaceFileContent:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string, maxLength: 512000 }
    WorkspaceSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 256 }
    WorkspaceSearchMatch:
      type: object
      required: [path, line, text]
      properties:
        path: { type: string }
        line: { type: integer, minimum: 1 }
        text: { type: string, maxLength: 2000 }
    WorkspaceSearchResult:
      type: object
      required: [matches, truncated]
      properties:
        matches:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/WorkspaceSearchMatch' }
        truncated: { type: boolean }
    WorkspaceGitWorktreeCatalog:
      type: object
      required: [worktrees]
      properties:
        worktrees:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/WorkspaceGitWorktree' }
    WorkspaceGitWorktree:
      type: object
      required: [path, locked, missing, is_main]
      properties:
        path: { type: string, description: Absolute worktree root path. }
        head: { type: string, description: Raw HEAD contents (ref or detached SHA). }
        branch: { type: string, description: Branch name when HEAD is refs/heads/*. }
        locked: { type: boolean, description: True when a well-known git lock file is present for this worktree. }
        missing: { type: boolean, description: True when a linked worktree admin entry remains but the checkout directory is gone. }
        is_main: { type: boolean, description: True for the primary checkout that owns `.git/`. }
    WorkspaceGitWorktreeAddInput:
      type: object
      properties:
        prune:
          type: boolean
          default: false
          description: When true, run `git worktree prune` and return the refreshed WorkspaceGitWorktreeCatalog instead of adding a worktree. Must not be combined with path/branch/new_branch.
        path: { type: string, description: Absolute unused directory path for the new worktree. Required unless prune is true. }
        branch: { type: string, description: Existing branch to check out. Required when new_branch is omitted and prune is false. }
        new_branch: { type: string, description: Create and check out this branch (`git worktree add -b`). }
    WorkspaceGitWorktreeRemoveInput:
      type: object
      required: [path]
      properties:
        path: { type: string, description: Absolute path of a linked worktree (not the main checkout). }
        force: { type: boolean, default: false, description: Pass `--force` to git worktree remove. }
    WorkspaceGitWorktreeRemoval:
      type: object
      required: [removed]
      properties:
        removed: { type: string }
        force: { type: boolean }
    WorkspaceGitWorktreeLockInput:
      type: object
      required: [path, locked]
      properties:
        path: { type: string, description: Absolute path of a listed worktree. }
        locked: { type: boolean, description: True to lock, false to unlock. }
        reason: { type: string, maxLength: 256, description: Optional reason when locking (`git worktree lock --reason`). }
    WorkspaceRepositoryMapResponse:
      type: object
      required: [text, bytes, estimated_token_bound, budget_bytes, file_count, symbol_count, files_scanned, truncated, untrusted, ranked_paths]
      properties:
        text:
          type: string
          description: Untrusted extractive repository map text intended for model context.
        bytes: { type: integer, minimum: 0, description: Measured UTF-8 byte length of text. }
        estimated_token_bound: { type: integer, minimum: 0, description: Conservative ceil(bytes/4) bound, not provider usage. }
        budget_bytes: { type: integer, minimum: 1024 }
        file_count: { type: integer, minimum: 0 }
        symbol_count: { type: integer, minimum: 0 }
        files_scanned: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        untrusted: { type: boolean }
        ranked_paths:
          type: array
          items: { type: string }
    WorkspaceEditInput:
      type: object
      required: [path, content]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        content: { type: string, maxLength: 512000, description: Complete proposed UTF-8 file contents. }
    WorkspaceEditProposal:
      type: object
      required: [id, session_id, path, diff, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        path: { type: string }
        diff: { type: string, maxLength: 1100000 }
        status: { type: string, enum: [pending, applying, applied, rejected, conflict, interrupted] }
        created_at: { type: string }
        updated_at: { type: string }
    WorkspaceEditSummary:
      type: object
      required: [id, path, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        status: { type: string, enum: [pending, applying, applied, rejected, conflict, interrupted] }
        created_at: { type: string }
        updated_at: { type: string }
    WorkspaceEditAction:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [applied, rejected] }
    ShellCommand:
      type: object
      required: [id, command, cwd, timeout_seconds, status, exit_code, output, created_at, updated_at, sandbox]
      properties:
        id: { type: string, format: uuid }
        command: { type: string, maxLength: 8192 }
        cwd: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        status: { type: string, enum: [pending, running, succeeded, failed, timed_out, output_limited, rejected, uncertain] }
        exit_code: { type: integer }
        output: { type: string, maxLength: 65536 }
        created_at: { type: string }
        updated_at: { type: string }
        sandbox:
          $ref: '#/components/schemas/ReviewSandboxPreview'
          description: Preview from VEASEL_SHELL_SANDBOX and platform backends (default require; missing backends fail closed).
    CreateSession:
      type: object
      required: [title, directory]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed session label; rejects NUL, CR, and LF control bytes.
        directory:
          type: string
          minLength: 1
          maxLength: 4096
          description: Existing workspace directory; the server stores its canonical path and rejects NUL bytes.
    Session:
      type: object
      required: [id, title, directory, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        directory:
          type: string
        created_at:
          type: string
          description: SQLite timestamp formatted as YYYY-MM-DD HH:MM:SS.
    GlobalUsageSummary:
      type: object
      required: [sessions, completed_turns, reported_turns, input_tokens, output_tokens, usage_reported, cache_read_tokens, cache_creation_tokens, cache_reported, reasoning_tokens, reasoning_reported, cost, models]
      properties:
        sessions: { type: integer, minimum: 0 }
        completed_turns: { type: integer, minimum: 0 }
        reported_turns: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        usage_reported: { type: boolean }
        cache_read_tokens: { type: integer, minimum: 0 }
        cache_creation_tokens: { type: integer, minimum: 0 }
        cache_reported: { type: boolean }
        reasoning_tokens: { type: integer, minimum: 0 }
        reasoning_reported: { type: boolean }
        cost: { type: string }
        models:
          type: array
          description: Completed-operation usage grouped by provider and model, in lexical order.
          items:
            $ref: '#/components/schemas/GlobalUsageModelSummary'
    GlobalUsageModelSummary:
      type: object
      required: [provider, model, completed_turns, reported_turns, input_tokens, output_tokens, cache_read_tokens, cache_creation_tokens, cache_reported, reasoning_tokens, reasoning_reported, cost]
      properties:
        provider: { type: string }
        model: { type: string }
        completed_turns: { type: integer, minimum: 0 }
        reported_turns: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cache_read_tokens: { type: integer, minimum: 0 }
        cache_creation_tokens: { type: integer, minimum: 0 }
        cache_reported: { type: boolean }
        reasoning_tokens: { type: integer, minimum: 0 }
        reasoning_reported: { type: boolean }
        cost: { type: string }
    SessionUsageSummary:
      type: object
      required: [session_id, completed_turns, reported_turns, input_tokens, output_tokens, usage_reported, cache_read_tokens, cache_creation_tokens, cache_reported, cost]
      properties:
        session_id: { type: string, format: uuid }
        completed_turns: { type: integer, minimum: 0 }
        reported_turns: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        usage_reported:
          type: boolean
          description: True when at least one completed turn had provider-reported token counts.
        cache_read_tokens:
          type: integer
          minimum: 0
          description: Sum of provider-reported cache read/hit tokens across turns that set cache_reported. Not an estimated savings figure.
        cache_creation_tokens:
          type: integer
          minimum: 0
          description: Sum of provider-reported cache write/creation tokens across turns that set cache_reported.
        cache_reported:
          type: boolean
          description: True when at least one completed turn included provider cache fields (including explicit zeros). False when providers omitted cache keys.
        cost:
          type: string
          description: USD total from provider-reported tokens when every reported turn matches the pinned cost schedule (Models.dev [cost] tables; override via VEASEL_COST_SCHEDULE). Otherwise the literal unavailable. Veasel never invents rates or token counts.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1048576
    CompletionInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ChatMessage'
    CompletionOutput:
      type: object
      required: [provider, model, content]
      properties:
        provider:
          type: string
        model:
          type: string
        content:
          type: string
    SendMessage:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1048576
        collect_trace:
          type: boolean
          default: false
          description: Opt into saving an ATIF v1.8 trajectory for this operation. It can contain sensitive prompt and workspace content; failed turns do not currently persist partial trajectories.
    ChatTurn:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
    ChatExchange:
      type: object
      required: [messages, provider, model]
      properties:
        messages:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/ChatTurn'
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          minimum: 0
          description: Present only when the provider reported token usage for this turn.
        output_tokens:
          type: integer
          minimum: 0
          description: Present only when the provider reported token usage for this turn.
        usage_reported:
          type: boolean
          description: True only when input_tokens and output_tokens came from the provider adapter. Cost remains unavailable.
        cache_read_tokens:
          type: integer
          minimum: 0
          description: Provider-reported cache read/hit tokens when cache_reported is true.
        cache_creation_tokens:
          type: integer
          minimum: 0
          description: Provider-reported cache write/creation tokens when cache_reported is true.
        cache_reported:
          type: boolean
          description: True only when the provider payload included cache-related usage fields. Never invents hits or savings.
    SessionTurnAccepted:
      type: object
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running]
          description: Prefer respond-async returns queued until a worker claims the durable job.
    SessionOperation:
      type: object
      required: [id, session_id, status, provider, model, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, cancelling, completed, failed, cancelled, uncertain]
          description: >-
            queued means the turn request is durable and waiting for a worker.
            running/cancelling means a worker claimed it. After restart, queued
            jobs resume; running/cancelling become uncertain and are never replayed.
        provider: { type: string }
        model: { type: string }
        error: { type: string, maxLength: 1024 }
        input_tokens:
          type: integer
          minimum: 0
          description: Present only when the provider reported token usage for this turn.
        output_tokens:
          type: integer
          minimum: 0
          description: Present only when the provider reported token usage for this turn.
        usage_reported:
          type: boolean
          description: True only when input_tokens and output_tokens came from the provider adapter. Veasel does not estimate tokens or cost.
        cache_read_tokens:
          type: integer
          minimum: 0
          description: Provider-reported cache read/hit tokens when cache_reported is true.
        cache_creation_tokens:
          type: integer
          minimum: 0
          description: Provider-reported cache write/creation tokens when cache_reported is true.
        cache_reported:
          type: boolean
          description: True only when the provider payload included cache-related usage fields.
        reasoning_tokens:
          type: integer
          minimum: 0
          description: Provider-reported reasoning token count when reasoning_reported is true.
        reasoning_reported:
          type: boolean
          description: True only when the provider supplied a reasoning token counter.
        created_at: { type: string }
        updated_at: { type: string }
    GlobalSessionOperation:
      type: object
      required: [operation, session_title]
      properties:
        operation:
          $ref: '#/components/schemas/SessionOperation'
        session_title: { type: string }
    GlobalSessionOperationsPage:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSessionOperation'
        next_before:
          type: string
          format: uuid
          description: Present when another page is available.
    SessionOperationResult:
      type: object
      required: [session_id, operation_id, status, provider, model, content]
      properties:
        session_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        status: { type: string, const: completed }
        provider: { type: string }
        model: { type: string }
        content: { type: string, maxLength: 16000000 }
        trajectory:
          type: string
          description: Optional ATIF v1.8 JSON string, present only when collect_trace was requested and trajectory persistence succeeded.
        input_tokens:
          type: integer
          minimum: 0
          description: Present only when the provider reported token usage for this turn.
        output_tokens:
          type: integer
          minimum: 0
          description: Present only when the provider reported token usage for this turn.
        usage_reported:
          type: boolean
          description: True only when input_tokens and output_tokens came from the provider adapter. Cost remains unavailable.
        cache_read_tokens:
          type: integer
          minimum: 0
          description: Provider-reported cache read/hit tokens when cache_reported is true.
        cache_creation_tokens:
          type: integer
          minimum: 0
          description: Provider-reported cache write/creation tokens when cache_reported is true.
        cache_reported:
          type: boolean
          description: True only when the provider payload included cache-related usage fields.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
