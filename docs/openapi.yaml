openapi: 3.1.0
info:
  title: Veasel Code API
  version: 0.3.1
  description: Local sessions, multi-provider chat, bounded workspace tools with durable file edit and shell command approval, experimental Agent Plugin Skills and trusted stdio/Streamable HTTP MCP tools with explicit per-call review, and replayable events. Workspace excerpts and MCP tool arguments/results are sent to the configured model provider. Approved shell commands and MCP servers run with the server OS user permissions and inherited environment without an OS sandbox.
servers:
  - url: http://127.0.0.1:4097
    description: Loopback only; remote binding is not implemented.
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Implemented server capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /v1/config/model:
    get:
      operationId: getModelSettings
      description: Returns the active provider and saved model profiles. API keys are never returned; only api_key_saved is exposed.
      responses:
        '200':
          description: Sanitized provider profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettingsView'
    post:
      operationId: updateModelSettings
      description: Selects a provider and updates its model, endpoint, and optional API key. Empty api_key preserves an existing key; clear_api_key removes it. Credentials are stored locally with owner-only POSIX permissions, not encrypted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelSettingsInput'
      responses:
        '200':
          description: Updated sanitized provider profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSettingsView'
        '400':
          description: Invalid provider, model, endpoint, or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins:
    get:
      operationId: listAgentPlugins
      description: Discovers bounded local Agent Plugins and returns metadata without skill instruction bodies.
      responses:
        '200':
          description: Available plugins and non-fatal discovery diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginCatalog'
        '500':
          description: Plugin directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions:
    get:
      operationId: listSessions
      responses:
        '200':
          description: Stored sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session and session.created event were stored atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid JSON or request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMessages
      description: Returns up to 100 persisted messages in chronological order, newest page first. Use the first message ID from a page as the exclusive before cursor to fetch the preceding page. Omitting before returns the latest page; limit defaults to 100.
      parameters:
        - in: query
          name: before
          required: false
          description: Positive message ID; return messages with lower IDs.
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          required: false
          description: Page size, default 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Session chat history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatTurn'
        '400':
          description: Invalid cursor or page size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: sendSessionMessage
      description: >-
        Completes and atomically stores a user and assistant turn in the
        session. Provider-native tool calls may list/read/search bounded
        workspace files and create durable single-file edit proposals.
        Requested workspace content is sent to the configured provider;
        proposed file contents are not written before explicit approval.
        Assistant text streams as durable assistant.delta events on
        /v1/events. Successful turns atomically persist history and a
        session.turn_completed event; failed or cancelled turns persist a
        terminal event with a safe public error. Send Prefer: respond-async to
        receive 202 immediately and follow that event or query the durable
        operation resource; without this preference
        the request waits and returns the full ChatExchange. Send a unique
        X-Veasel-Operation-ID UUID to allow cancellation; turns have a
        two-minute deadline. Set collect_trace true to opt into persisting an
        ATIF v1.8 trajectory for a successful operation; it includes the prompt
        and tool I/O, and should be treated as sensitive workspace content.
      parameters:
        - in: header
          name: X-Veasel-Operation-ID
          required: false
          description: Caller-generated UUID used by the session cancellation endpoint. Reusing an active ID returns 409.
          schema:
            type: string
            format: uuid
        - in: header
          name: Prefer
          required: false
          description: Use respond-async to return an operation ID immediately. Follow its terminal event or query /v1/sessions/{id}/operations/{operation_id}. Omit to wait for a ChatExchange response.
          schema:
            type: string
            example: respond-async
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '202':
          description: The accepted turn is stored before the response. Query the session operation resource or follow session.turn_completed. After a restart, work without a recorded result is classified uncertain and is never replayed.
          headers:
            Preference-Applied:
              description: Confirms that respond-async was applied.
              schema:
                type: string
                example: respond-async
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTurnAccepted'
        '200':
          description: Persisted exchange and the provider/model that answered it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchange'
        '400':
          description: Invalid or oversized message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured model provider request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider is not configured or all provider slots are occupied; retry after one second when Retry-After is present.
          headers:
            Retry-After:
              description: Seconds to wait before retrying an overloaded provider request.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The two-minute turn deadline expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The active turn was cancelled or the operation identifier is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/operations/{operation_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSessionOperation
      description: Returns durable async session turn status. The operation belongs to the session in the path. A server restart classifies active work as uncertain and never repeats provider or tool effects.
      responses:
        '200':
          description: Current operation status and safe terminal metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOperation'
        '404':
          description: Session or operation was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/operations/{operation_id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelSessionTurn
      description: Cancels an active session turn, including one waiting for its serialized session slot. The turn request returns 409; provider transports retain their provider slot until bounded network cleanup finishes.
      responses:
        '202':
          description: Cancellation was signaled.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: { type: string, format: uuid }
                  status: { type: string, enum: [cancelling, completed, cancelled, failed, uncertain] }
        '404':
          description: Session or active operation not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/operations/{operation_id}/result:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSessionOperationResult
      description: Returns the assistant text reconstructed from persisted deltas for this exact operation, avoiding ambiguity when turns share a session.
      responses:
        '200':
          description: Completed assistant result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionOperationResult' }
        '404':
          description: Session operation was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Operation has not completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/operations/{operation_id}/cancel:
    parameters:
      - in: path
        name: operation_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelChatCompletion
      description: Cancels an active direct chat completion. The completion request returns 409; provider transports retain their provider slot until bounded network cleanup finishes.
      responses:
        '202':
          description: Cancellation was signaled.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: { type: string, format: uuid }
                  status: { type: string, const: cancelling }
        '404':
          description: Active operation not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/skills:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionSkills
      description: Returns the Agent Plugin skills enabled for this session.
      responses:
        '200':
          description: Active skill identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPluginSkill'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: setSessionSkill
      description: Enables or disables a validated Agent Plugin skill for the session. Enabled instructions are included as untrusted system context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSessionPluginSkill'
      responses:
        '200':
          description: Updated active skill identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPluginSkill'
        '400':
          description: Invalid request or skill instructions cannot be safely loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or plugin skill not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/mcp-servers:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMCPServers
      description: Returns MCP servers explicitly trusted for this session.
      responses:
        '200':
          description: Trusted MCP server identifiers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionPluginMCPServer' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: setSessionMCPServerTrust
      description: Trusts or revokes a stdio or Streamable HTTP MCP server for this session. A trusted server connects or launches on the next model turn. Stdio uses the Veasel process user's OS privileges; HTTP is pinned to its configured origin and redirects are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSessionPluginMCPServer' }
      responses:
        '200':
          description: Updated trusted MCP server identifiers.

  /v1/sessions/{id}/mcp-tool-calls:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listMcpToolCallApprovals
      description: Lists up to 50 recent MCP call proposals and outcomes without returning argument contents. Pending calls have not reached their MCP server; inspect one through the detail route.
      responses:
        '200':
          description: Durable MCP tool call history.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/PluginMCPToolCallSummary' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/mcp-tool-calls/{call_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: inspectMcpToolCallApproval
      description: Returns the exact bounded MCP tool arguments and durably records inspection before approval.
      responses:
        '200':
          description: Exact tool arguments and durable call state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginMCPToolCallApproval' }
        '404':
          description: Session or call not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/mcp-tool-calls/{call_id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveMcpToolCall
      description: Records one-time approval after inspection. The waiting model turn then invokes the exact MCP tool once; the API request does not execute the tool itself.
      responses:
        '200':
          description: The waiting call is approved and may begin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginMCPToolCallApproval' }
        '404':
          description: Session or call not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Call has not been inspected or is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/mcp-tool-calls/{call_id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectMcpToolCall
      description: Durably rejects a pending MCP call. The waiting provider turn receives a rejection error; Veasel does not retry the call.
      responses:
        '200':
          description: The call is rejected and will not reach its MCP server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginMCPToolCallApproval' }
        '404':
          description: Session or call not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Call is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionPluginMCPServer' }
        '400':
          description: Invalid request or unsupported MCP transport.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session or MCP server not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/files:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWorkspaceFiles
      description: Lists at most 500 regular files beneath the session workspace. Common generated and dependency directories and all symbolic links are skipped.
      responses:
        '200':
          description: Sorted relative workspace paths; truncated is true if any configured listing limit was reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileList' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/file:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: readWorkspaceFile
      description: Reads one text file of at most 512000 bytes after resolving its path beneath the canonical session root. Outside-root symlinks, binary files, and parent traversal are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceFileInput' }
      responses:
        '200':
          description: Relative file path and UTF-8 text content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileContent' }
        '400':
          description: Invalid, oversized, binary, or out-of-root path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/search:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: searchWorkspace
      description: Searches literal, case-sensitive text beneath the session root, with bounded file, byte, and result counts. Binary and oversized files are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSearchInput' }
      responses:
        '200':
          description: Matching paths, one-based line numbers, and bounded line excerpts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSearchResult' }
        '400':
          description: Invalid or oversized search query.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWorkspaceEdits
      description: Lists recent workspace edit proposals and their durable review states. Proposal content is never applied by listing.
      responses:
        '200':
          description: Recent review proposals.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/WorkspaceEditSummary' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: proposeWorkspaceEdit
      description: Stores a unified diff for one existing file or a new file in an existing directory. This operation never writes to the workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceEditInput' }
      responses:
        '201':
          description: Diff saved for explicit user review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditProposal' }
        '400':
          description: Invalid path, text, or proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: The session has reached its pending proposal limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits/{edit_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: edit_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWorkspaceEdit
      description: Returns one proposal diff and durably records that the review view was opened before approval.
      responses:
        '200':
          description: Diff and durable proposal state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditProposal' }
        '404':
          description: Session or proposal not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits/{edit_id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: edit_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveWorkspaceEdit
      description: Durably records approval, checks that the file still matches the reviewed snapshot, then applies the file replacement. An interrupted application is never replayed automatically.
      responses:
        '200':
          description: The approved file edit was applied and recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditAction' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal has not been reviewed or is no longer pending, or the file changed or became unsafe since review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The write outcome is uncertain. Inspect the workspace before proceeding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/edits/{edit_id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: edit_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectWorkspaceEdit
      description: Durably rejects a pending proposal without changing the workspace.
      responses:
        '200':
          description: The proposal was rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditAction' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal is not pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listShellCommandProposals
      description: Lists recent durable command proposals and outcomes.
      responses:
        '200':
          description: Recent command proposals.
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/ShellCommand' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands/{command_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: command_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: reviewShellCommandProposal
      description: Returns the exact command, cwd and timeout, and durably records that the review view was opened.
      responses:
        '200':
          description: Exact command awaiting approval or its persisted outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellCommand' }
        '404':
          description: Session or proposal not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands/{command_id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: command_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveShellCommandProposal
      description: Durably records explicit approval before running the exact reviewed command with the Veasel process OS user's permissions. Execution is not sandboxed, has a bounded timeout/output, and is never retried after interruption.
      responses:
        '200':
          description: Command outcome and bounded output.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShellCommand' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal has not been reviewed or is no longer pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: The bounded command execution capacity is full.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/commands/{command_id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: command_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rejectShellCommandProposal
      description: Durably rejects a command proposal without executing it.
      responses:
        '200':
          description: The command was rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEditAction' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Proposal is not pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Sends bounded system, user, and assistant messages to the configured model provider. Send a unique X-Veasel-Operation-ID UUID and use /v1/operations/{operation_id}/cancel to cancel it. Turns have a two-minute deadline.
      parameters:
        - in: header
          name: X-Veasel-Operation-ID
          required: false
          description: Caller-generated UUID used by the direct completion cancellation endpoint. Reusing an active ID returns 409.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionInput'
      responses:
        '200':
          description: Completed model response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionOutput'
        '400':
          description: Invalid or oversized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured model provider request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Provider is not configured or all provider slots are occupied; retry after one second when Retry-After is present.
          headers:
            Retry-After:
              description: Seconds to wait before retrying an overloaded provider request.
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: The two-minute turn deadline expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The active turn was cancelled or the operation identifier is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events:
    get:
      operationId: streamEvents
      description: Replays persisted events newer than Last-Event-ID, then streams new events. During session turns, assistant.delta events include data.operation_id and data.delta. Async turns begin with session.turn_started and end with session.turn_completed. Completion includes operation_id and status; successful events include provider and model, failed events include a safe public error, and uncertain events indicate the process stopped before a result was recorded.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          description: Non-negative numeric event ID; defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Server-sent event stream using event IDs as resumable cursors. Each event data field is a JSON Event object; assistant.delta carries operation_id and delta, session.turn_started announces a durable operation, and session.turn_completed carries its final status.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Last-Event-ID is not a non-negative integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [healthy, version]
      properties:
        healthy:
          type: boolean
        version:
          type: string
    Capabilities:
      type: object
      required: [api_version, features]
      properties:
        api_version:
          type: string
        features:
          type: array
          description: Includes sessions.operations.trace.atif_v1_8 for opt-in successful operation trajectory export. Traces may contain prompt and workspace content. Also includes agent.tools.skill_read_resource when model support is configured; the tool is exposed only while one or more Agent Skills are active in the session.
          items:
            type: string
    ModelSettingsInput:
      type: object
      required: [provider, model, base_url]
      properties:
        provider:
          type: string
          enum: [openai-compatible, openai, anthropic, gemini, deepseek, groq, together, fireworks, mistral, openrouter, xai, cerebras, perplexity, deepinfra, venice, ollama, hyperbolic, moonshot, nvidia, siliconflow, sambanova, novita, nebius, huggingface, vercel]
        model:
          type: string
          minLength: 1
          maxLength: 200
        base_url:
          type: string
          maxLength: 2048
        api_key:
          type: string
          writeOnly: true
          maxLength: 4096
          description: Omit or send an empty string to preserve the saved key.
        clear_api_key:
          type: boolean
          default: false
    ModelSettingsView:
      type: object
      required: [active_provider, profiles, providers]
      properties:
        active_provider:
          type: string
          enum: [openai-compatible, openai, anthropic, gemini, deepseek, groq, together, fireworks, mistral, openrouter, xai, cerebras, perplexity, deepinfra, venice, ollama, hyperbolic, moonshot, nvidia, siliconflow, sambanova, novita, nebius, huggingface, vercel]
        profiles:
          type: object
          additionalProperties:
            type: object
            required: [model, base_url, api_key_saved]
            properties:
              model: { type: string }
              base_url: { type: string }
              api_key_saved: { type: boolean }
        providers:
          type: array
          description: Built-in provider presets. OpenAI-compatible entries share the Chat Completions transport and can override the endpoint.
          items:
            type: object
            required: [id, name, description, protocol, base_url, environment_key, requires_api_key]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              protocol: { type: string, enum: [openai-compatible, anthropic, gemini] }
              base_url: { type: string }
              environment_key: { type: string }
              requires_api_key: { type: boolean }
    PluginCatalog:
      type: object
      required: [plugins, diagnostics]
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginCatalogEntry'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/PluginDiagnostic'
    PluginCatalogEntry:
      type: object
      required: [name, version, description, skills, mcp_servers, diagnostics]
      properties:
        name: { type: string }
        version: { type: string }
        description: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/PluginSkillSummary' }
        mcp_servers:
          type: array
          description: Validated declarations. Stdio and Streamable HTTP servers can be trusted per session; trusted servers may connect during the next model turn. Redirects are refused for HTTP servers.
          items: { $ref: '#/components/schemas/PluginMCPServerSummary' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/PluginDiagnostic' }
    PluginSkillSummary:
      type: object
      required: [name, description, allowed_tools_declared, allowed_tools]
      properties:
        name: { type: string }
        description: { type: string }
        allowed_tools_declared:
          type: boolean
          description: True when the skill declares the experimental Agent Skills allowed-tools field, including when its list is empty.
        allowed_tools:
          type: array
          description: Sorted, deduplicated tool names declared by the skill. An empty list with allowed_tools_declared true restricts the skill to no tools.
          items: { type: string }
    PluginMCPServerSummary:
      type: object
      required: [name, transport, command, url_origin, header_count, header_names]
      properties:
        name: { type: string }
        transport: { type: string }
        command:
          type: string
          description: Executable token declared by the plugin, or a resolved package path for a ./ command; empty for other transports.
        url_origin:
          type: string
          description: Lowercase scheme and host with port, if present; path and query are omitted.
        header_count:
          type: integer
          minimum: 0
          description: Number of configured headers.
        header_names:
          type: array
          description: Sorted configured header names; header values are not returned.
          items: { type: string }
    PluginDiagnostic:
      type: object
      required: [component, message]
      properties:
        component: { type: string }
        message: { type: string }
    SessionPluginSkill:
      type: object
      required: [plugin_name, skill_name]
      properties:
        plugin_name: { type: string }
        skill_name: { type: string }
    SessionPluginMCPServer:
      type: object
      required: [plugin_name, server_name]
      properties:
        plugin_name: { type: string }
        server_name: { type: string }
    PluginMCPToolCallApproval:
      type: object
      required: [id, operation_id, plugin_name, server_name, tool_name, arguments_json, status, reviewed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        plugin_name: { type: string }
        server_name: { type: string }
        tool_name: { type: string }
        arguments_json: { type: string, description: Exact JSON object sent by the model, limited to 32768 UTF-8 bytes; review as untrusted input. }
        status:
          type: string
          enum: [pending, approved, running, completed, rejected, failed, cancelled, uncertain]
        reviewed_at: { type: string, description: Empty until the detail view records inspection. }
        created_at: { type: string }
        updated_at: { type: string }
    PluginMCPToolCallSummary:
      type: object
      required: [id, operation_id, plugin_name, server_name, tool_name, arguments_bytes, status, reviewed_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        plugin_name: { type: string }
        server_name: { type: string }
        tool_name: { type: string }
        arguments_bytes: { type: integer, minimum: 2, maximum: 32768, description: UTF-8 byte length of the withheld tool arguments. Use the detail route to inspect them. }
        status:
          type: string
          enum: [pending, approved, running, completed, rejected, failed, cancelled, uncertain]
        reviewed_at: { type: string, description: Empty until the detail view records inspection. }
        created_at: { type: string }
        updated_at: { type: string }
    SetSessionPluginMCPServer:
      type: object
      required: [plugin_name, server_name, trusted]
      properties:
        plugin_name: { type: string, minLength: 1, maxLength: 64 }
        server_name: { type: string, minLength: 1, maxLength: 256 }
        trusted: { type: boolean }
    SetSessionPluginSkill:
      type: object
      required: [plugin_name, skill_name, enabled]
      properties:
        plugin_name: { type: string, minLength: 1 }
        skill_name: { type: string, minLength: 1 }
        enabled: { type: boolean }
    WorkspaceFileList:
      type: object
      required: [files, truncated]
      properties:
        files:
          type: array
          maxItems: 500
          items: { type: string }
        truncated: { type: boolean }
    WorkspaceFileInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
    WorkspaceFileContent:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string, maxLength: 512000 }
    WorkspaceSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 256 }
    WorkspaceSearchMatch:
      type: object
      required: [path, line, text]
      properties:
        path: { type: string }
        line: { type: integer, minimum: 1 }
        text: { type: string, maxLength: 2000 }
    WorkspaceSearchResult:
      type: object
      required: [matches, truncated]
      properties:
        matches:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/WorkspaceSearchMatch' }
        truncated: { type: boolean }
    WorkspaceEditInput:
      type: object
      required: [path, content]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        content: { type: string, maxLength: 512000, description: Complete proposed UTF-8 file contents. }
    WorkspaceEditProposal:
      type: object
      required: [id, session_id, path, diff, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        path: { type: string }
        diff: { type: string, maxLength: 1100000 }
        status: { type: string, enum: [pending, applying, applied, rejected, conflict, interrupted] }
        created_at: { type: string }
        updated_at: { type: string }
    WorkspaceEditSummary:
      type: object
      required: [id, path, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        path: { type: string }
        status: { type: string, enum: [pending, applying, applied, rejected, conflict, interrupted] }
        created_at: { type: string }
        updated_at: { type: string }
    WorkspaceEditAction:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [applied, rejected] }
    ShellCommand:
      type: object
      required: [id, command, cwd, timeout_seconds, status, exit_code, output, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        command: { type: string, maxLength: 8192 }
        cwd: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        status: { type: string, enum: [pending, running, succeeded, failed, timed_out, output_limited, rejected, uncertain] }
        exit_code: { type: integer }
        output: { type: string, maxLength: 65536 }
        created_at: { type: string }
        updated_at: { type: string }
    CreateSession:
      type: object
      required: [title, directory]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        directory:
          type: string
          minLength: 1
          maxLength: 4096
          description: Existing workspace directory; the server stores its canonical path.
    Session:
      type: object
      required: [id, title, directory, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        directory:
          type: string
        created_at:
          type: string
          description: SQLite timestamp formatted as YYYY-MM-DD HH:MM:SS.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 100000
    CompletionInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ChatMessage'
    CompletionOutput:
      type: object
      required: [provider, model, content]
      properties:
        provider:
          type: string
        model:
          type: string
        content:
          type: string
    SendMessage:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 100000
        collect_trace:
          type: boolean
          default: false
          description: Opt into saving an ATIF v1.8 trajectory for this operation. It can contain sensitive prompt and workspace content; failed turns do not currently persist partial trajectories.
    ChatTurn:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
    ChatExchange:
      type: object
      required: [messages, provider, model]
      properties:
        messages:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/ChatTurn'
        provider:
          type: string
        model:
          type: string
    SessionTurnAccepted:
      type: object
      required: [operation_id, status]
      properties:
        operation_id:
          type: string
          format: uuid
        status:
          type: string
          const: running
    SessionOperation:
      type: object
      required: [id, session_id, status, provider, model, error, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, cancelling, completed, failed, cancelled, uncertain]
        provider: { type: string }
        model: { type: string }
        error: { type: string, maxLength: 1024 }
        created_at: { type: string }
        updated_at: { type: string }
    SessionOperationResult:
      type: object
      required: [session_id, operation_id, status, provider, model, content]
      properties:
        session_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        status: { type: string, const: completed }
        provider: { type: string }
        model: { type: string }
        content: { type: string, maxLength: 16000000 }
        trajectory:
          type: string
          description: Optional ATIF v1.8 JSON string, present only when collect_trace was requested and trajectory persistence succeeded.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
