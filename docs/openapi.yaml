openapi: 3.1.0
info:
  title: Veasel Code API
  version: 0.3.1
  description: Local session, multi-provider chat, Agent Plugin skill selection, bounded read-only workspace inspection, and event API. Workspace inspection is exposed to API clients but is not yet connected to provider tool calling.
servers:
  - url: http://127.0.0.1:4097
    description: Loopback only; remote binding is not implemented.
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Server is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Implemented server capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
  /v1/plugins:
    get:
      operationId: listAgentPlugins
      description: Discovers bounded local Agent Plugins and returns metadata without skill instruction bodies.
      responses:
        '200':
          description: Available plugins and non-fatal discovery diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginCatalog'
        '500':
          description: Plugin directory could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions:
    get:
      operationId: listSessions
      responses:
        '200':
          description: Stored sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
      responses:
        '201':
          description: Session and session.created event were stored atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid JSON or request fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}:
    get:
      operationId: getSession
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionMessages
      description: Returns up to the latest 100 persisted turns in chronological order.
      responses:
        '200':
          description: Session chat history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatTurn'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: sendSessionMessage
      description: Completes and atomically stores a user and assistant turn in the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '200':
          description: Persisted exchange and the provider/model that answered it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatExchange'
        '400':
          description: Invalid or oversized message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured model provider request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Model provider is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/skills:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionSkills
      description: Returns the Agent Plugin skills enabled for this session.
      responses:
        '200':
          description: Active skill identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPluginSkill'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: setSessionSkill
      description: Enables or disables a validated Agent Plugin skill for the session. Enabled instructions are included as untrusted system context.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSessionPluginSkill'
      responses:
        '200':
          description: Updated active skill identifiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionPluginSkill'
        '400':
          description: Invalid request or skill instructions cannot be safely loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Session or plugin skill not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/sessions/{id}/workspace/files:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listWorkspaceFiles
      description: Lists at most 500 regular files beneath the session workspace. Common generated and dependency directories and all symbolic links are skipped.
      responses:
        '200':
          description: Sorted relative workspace paths; truncated is true if any configured listing limit was reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileList' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/file:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: readWorkspaceFile
      description: Reads one text file of at most 512000 bytes after resolving its path beneath the canonical session root. Outside-root symlinks, binary files, and parent traversal are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceFileInput' }
      responses:
        '200':
          description: Relative file path and UTF-8 text content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceFileContent' }
        '400':
          description: Invalid, oversized, binary, or out-of-root path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/sessions/{id}/workspace/search:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: searchWorkspace
      description: Searches literal, case-sensitive text beneath the session root, with bounded file, byte, and result counts. Binary and oversized files are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceSearchInput' }
      responses:
        '200':
          description: Matching paths, one-based line numbers, and bounded line excerpts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSearchResult' }
        '400':
          description: Invalid or oversized search query.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      description: Sends bounded system, user, and assistant messages to the configured model provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionInput'
      responses:
        '200':
          description: Completed model response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionOutput'
        '400':
          description: Invalid or oversized request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Configured model provider request failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Model provider is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/events:
    get:
      operationId: streamEvents
      description: Replays persisted events newer than Last-Event-ID, then streams new events.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          description: Non-negative numeric event ID; defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Server-sent event stream using event IDs as resumable cursors.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Last-Event-ID is not a non-negative integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [healthy, version]
      properties:
        healthy:
          type: boolean
        version:
          type: string
    Capabilities:
      type: object
      required: [api_version, features]
      properties:
        api_version:
          type: string
        features:
          type: array
          items:
            type: string
    PluginCatalog:
      type: object
      required: [plugins, diagnostics]
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginCatalogEntry'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/PluginDiagnostic'
    PluginCatalogEntry:
      type: object
      required: [name, version, description, skills, mcp_servers, diagnostics]
      properties:
        name: { type: string }
        version: { type: string }
        description: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/PluginSkillSummary' }
        mcp_servers:
          type: array
          description: Validated server declarations only; no MCP process is started by this API.
          items: { $ref: '#/components/schemas/PluginMCPServerSummary' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/PluginDiagnostic' }
    PluginSkillSummary:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    PluginMCPServerSummary:
      type: object
      required: [name, transport]
      properties:
        name: { type: string }
        transport: { type: string }
    PluginDiagnostic:
      type: object
      required: [component, message]
      properties:
        component: { type: string }
        message: { type: string }
    SessionPluginSkill:
      type: object
      required: [plugin_name, skill_name]
      properties:
        plugin_name: { type: string }
        skill_name: { type: string }
    SetSessionPluginSkill:
      type: object
      required: [plugin_name, skill_name, enabled]
      properties:
        plugin_name: { type: string, minLength: 1 }
        skill_name: { type: string, minLength: 1 }
        enabled: { type: boolean }
    WorkspaceFileList:
      type: object
      required: [files, truncated]
      properties:
        files:
          type: array
          maxItems: 500
          items: { type: string }
        truncated: { type: boolean }
    WorkspaceFileInput:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
    WorkspaceFileContent:
      type: object
      required: [path, content]
      properties:
        path: { type: string }
        content: { type: string, maxLength: 512000 }
    WorkspaceSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 256 }
    WorkspaceSearchMatch:
      type: object
      required: [path, line, text]
      properties:
        path: { type: string }
        line: { type: integer, minimum: 1 }
        text: { type: string, maxLength: 2000 }
    WorkspaceSearchResult:
      type: object
      required: [matches, truncated]
      properties:
        matches:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/WorkspaceSearchMatch' }
        truncated: { type: boolean }
    CreateSession:
      type: object
      required: [title, directory]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        directory:
          type: string
          minLength: 1
          maxLength: 4096
          description: Existing workspace directory; the server stores its canonical path.
    Session:
      type: object
      required: [id, title, directory, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        directory:
          type: string
        created_at:
          type: string
          description: SQLite timestamp formatted as YYYY-MM-DD HH:MM:SS.
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 100000
    CompletionInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ChatMessage'
    CompletionOutput:
      type: object
      required: [provider, model, content]
      properties:
        provider:
          type: string
        model:
          type: string
        content:
          type: string
    SendMessage:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 100000
    ChatTurn:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id:
          type: integer
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
    ChatExchange:
      type: object
      required: [messages, provider, model]
      properties:
        messages:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/ChatTurn'
        provider:
          type: string
        model:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
